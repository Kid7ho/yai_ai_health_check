[project]
name = "healthcheck"
version = "0.1.0"
description = "카카오톡 채널 기반 건강정보 검증 서비스 (음식·식품·건강기능식품 한정)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "youtube-transcript-api>=1.0",
    "trafilatura>=2.0",
    # 식약처 API 제한 시간(한국 시간 09~19시) 계산에 쓴다. 슬림 컨테이너 이미지에
    # 시간대 데이터가 없어도 Asia/Seoul을 읽을 수 있게 한다.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# 음성 인식은 무겁다. 모델 파일이 수백 MB이고 첫 실행에서 내려받는다.
# 자막이 없는 영상까지 처리해야 할 때만 설치한다.
asr = [
    "faster-whisper>=1.0",
    "yt-dlp>=2024.1",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/healthcheck"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
