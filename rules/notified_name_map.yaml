version: v1
# ════════════════════════════════════════════════════════════════════
# 고시형 원료 이름 대응표 — 우리 성분명 : 식약처 I2710 원료명(PRDCT_NM)
#
# 주장 추출은 rules/ingredient_aliases.yaml의 성분명(홍삼, 오메가3 …)으로
# 성분을 부른다. 식약처 공식 원료명은 "EPA 및 DHA 함유 유지"처럼 표기가 다르다.
# 이 표가 둘을 잇는다. scripts/sync_notified.py가 이 표를 보고
# rules/notified_ingredients.yaml을 만든다.
#
# 표에 없는 고시형 원료는 사본(data/mfds_i2710.json)에만 남고 판정에 쓰이지 않는다.
# 성분 사전에 새 성분을 넣을 때 여기에도 함께 넣는다.
#
# ⚠ 검토필요로 표시한 줄은 이름이 같은 물질을 가리키는지 확인이 필요하다.
#   원료 형태(추출물·음료)나 성분과 원료의 관계가 1:1이 아니다.
# ════════════════════════════════════════════════════════════════════

대응:
  홍삼: 홍삼
  인삼: 인삼
  프로바이오틱스: 프로바이오틱스
  마늘: 마늘
  칼슘: 칼슘
  마그네슘: 마그네슘
  아연: 아연
  철분: 철
  엽산: 엽산
  비타민C: 비타민 C
  비타민D: 비타민 D
  오메가3: EPA 및 DHA 함유 유지
  히알루론산: 히알루론산
  글루코사민: 글루코사민
  코엔자임Q10: 코엔자임Q10
  밀크씨슬: 밀크씨슬(카르두스 마리아누스) 추출물
  쏘팔메토: 쏘팔메토 열매 추출물
  # 검토필요: 루테인은 마리골드꽃추출물의 지표성분이다. 루테인 단독 원료명은 고시형에 없다
  루테인: 마리골드꽃추출물
  # 검토필요: 공전 원료는 추출물이다. 녹차 음료·잎 섭취 주장과 같은 대상인지 판단이 필요하다
  녹차: 녹차추출물
  # 검토필요: 공전 원료는 추출물이다
  가르시니아: 가르시니아캄보지아 추출물
  # 검토필요: 공전 원료는 추출물이다
  프로폴리스: 프로폴리스추출물

# 효능 대상 같은뜻 — 주장 쪽 효능 대상 : 공전 문구에 쓰이는 다른 표기
# 주장이 "혈액순환"이라 말하고 공전이 "혈행"이라 쓰면 일치도 비교가 되지 않는다.
# 의미가 같은지는 자문의 검수 대상이다.
효능_같은뜻:
  혈액순환: [혈행, 혈액흐름]
  칼슘 흡수: [칼슘과 인이 흡수]
  면역 기능: [면역기능, 면역력]
  면역력: [면역기능, 면역 기능]

# 대응시키지 않은 성분
#   비타민B     공전에는 B1·B2·B6·B12·나이아신·판토텐산·비오틴이 따로 있고 기능성이 다르다
#   진세노사이드 홍삼·인삼의 지표성분이며 원료가 아니다
#   블루베리    빌베리 추출물은 다른 식물이다
#   강황·콜라겐·크릴오일·보스웰리아 등  고시형이 아니다(개별인정형이면 I-0040에서 찾는다)
