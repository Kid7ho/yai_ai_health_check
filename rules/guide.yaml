version: g1
# ════════════════════════════════════════════════════════════════════
# 사용법 안내 문구 — 어르신이 채널을 처음 쓰거나 막혔을 때 보여 줍니다
#
# 원칙: 한 장에 제목 한 줄, 설명 두 줄 이내. "링크·URL·검증·판정" 대신
# "주소·보내다·믿을 만한지"를 씁니다. 버튼 글자는 14자 이내(카카오 제한).
#
# 판정 결과가 아니므로 규칙표 version과 무관합니다. 문구만 바꿀 때는 이 파일만
# 고치고 배포하면 됩니다.
# ════════════════════════════════════════════════════════════════════

처음_인사: |-
  안녕하세요, AI 건강지킴이예요.
  받은 건강 정보를 보내 주시면
  믿을 만한지 알려 드려요.

# "사용법 보기"를 누르거나 "사용법"이라고 보내면 넘겨 보는 카드로 보여 줍니다.
# 사진은 src/healthcheck/api/static/guide/에 있고 scripts/make_guide_images.py로 실제 휴대폰 캡처에서 만든다.
# 2026-09-19 실기기 캡처: 유튜브(iPhone) 공유 목록에 카카오톡이 바로 보이지 않고 [링크 복사]가 있다.
# 그래서 '카톡 말풍선 옆 [⤴]'과 '링크 복사 → 붙여넣기' 두 길을 보여 준다.
# TODO(확인필요): 카톡 [⤴] 전달 목록에 채널 대화방이 보이는지 실기기로 확인한다.
사용법_카드:
  - 제목: 이런 걸 확인해요
    설명: |-
      ○ 홍삼이 면역력에 좋대요
      ○ 이 제품 먹고 당뇨 나았대요
      ✕ 오늘 뭐 먹을까 식단 소개
    사진: 0_what
  - 제목: 카톡으로 받았다면
    설명: |-
      받은 글 옆 [⤴]을 누르고
      AI 건강지킴이를 고르세요
    사진: 1_forward
  - 제목: 유튜브에서 봤다면
    설명: |-
      [공유] → [링크 복사]를 누르세요
    사진: 2_copy
  - 제목: 여기에 붙여 넣고 보내기
    설명: |-
      입력칸을 꾹 눌러 붙여 넣고
      [↑]를 누르세요
    사진: 3_paste
  - 제목: 15초 뒤 답이 와요
    설명: |-
      🟢 믿을 만해요  🟡 조심하세요
      🔴 주의하세요  ⚪ 알 수 없어요
    사진: 4_result
  - 제목: 이건 못 봐요
    설명: |-
      사진, 약·병원 이야기
      이 결과는 참고용이며 진단이 아닙니다.
    사진: 5_limits

버튼:
  사용법: 사용법 보기
  체험: 한번 해 보기
  주의사항: 주의사항

# "주의사항"을 누르거나 보내면 보여 줍니다. 채팅방 아래 고정 메뉴(채널 관리자센터 설정)의 세 번째 버튼이다.
주의사항:
  제목: 꼭 알아 두세요
  설명: |-
    · 이 결과는 참고용이며 진단이 아닙니다.
    · 약을 바꾸거나 멈추기 전에 꼭 의사 선생님께 물어보세요.
    · "무엇이 어디에 좋다"고 말하는 내용을 확인해요.
    · 요리법·식단 소개, 약·병원 이야기는 확인할 게 없어요.
    · 논문과 식약처 자료로 확인하지만 틀릴 수 있어요.
    · 보내 주신 글은 확인에만 쓰고 90일 뒤 지워요.

주의사항_말:
  - 주의사항
  - 주의 사항
  - 유의사항
  - 주의할 점

# "한번 해 보기"를 누르면 이 문장을 대신 보내 결과가 어떻게 오는지 보여 줍니다.
체험_문장: 홍삼이 면역력 증진에 도움을 줄 수 있다
# [한번 해 보기] 결과 위에 붙는 말. 어르신이 무엇을 보내면 되는지 배우게 한다. {문장} 자리에 체험_문장이 들어간다.
체험_안내: |-
  이렇게 보내 보세요 👇
  「{문장}」
  받은 문장이나 영상 주소를 이렇게 보내 주시면 돼요.
사진_안내: |-
  사진은 아직 못 봐요.
  주소나 글을 보내 주세요.

# 이 말을 보내면 사용법 카드로 답합니다. 띄어쓰기·문장부호·물음표는 무시하고 비교합니다.
사용법_말:
  - 사용법
  - 사용법 보기
  - 사용 방법
  - 도움말
  - 도움
  - 설명서
  - 어떻게 써요
  - 어떻게 쓰나요
  - 어떻게 사용해요
  - 어떻게 사용하나요
  - 어떻게 하나요

# 이 말을 보내면 처음 인사로 답합니다. 오픈빌더 웰컴 블록에서 온 요청도 처음 인사로 답합니다.
처음_말:
  - 처음
  - 시작
  - 시작하기
  - 처음으로

# ── 주소가 아닌 말 (2026-09-19) ──────────────────────────────────────
# 주장이 잡히지 않는 글은 확인 과정(약 15초)에 넣지 않고 바로 답한다.
# 약·치료 이야기, 질병 치료·금지 광고 표현이 있으면 여기서 답하지 않고 확인 과정으로 보낸다(R-001 등).

# 15자 이내의 짧은 말에서만 본다. 음식 이름이나 효능 대상이 섞이면 인사로 보지 않는다.
인사_말: [안녕, 반가, 반갑, 하이, 헬로, 좋은 아침, 여보세요, 계세요, 누구세요]
감사_말: [감사, 고마, 고맙, 수고, 잘 봤, 잘 받았, 알겠, 알았, 그렇군요, 오케이, ㅎㅎ, ㅋㅋ]
# 한두 글자 맞장구는 말 첫머리에 올 때만 본다. "날씨가 좋네요"의 '네'를 감사로 보지 않게 한다.
맞장구_말: [네, 넵, 예, 응, ㅇㅋ, 굿, 오케이, 알겠]

# 물음표나 아래 말이 있으면 질문으로 본다. 음식 이름이나 효능 대상이 함께 있을 때만 질문 답을 한다.
질문_말: [까요, 나요, 가요, 되요, 돼요, 될까, 인가요, 뭐가, 뭘, 무엇, 어떤, 어떻게, 추천, 알려, 궁금]

답:
  인사: |-
    안녕하세요! 받은 건강 정보를 보내 주시면
    믿을 만한지 알려 드려요.
  감사: |-
    도움이 되셨다니 다행이에요.
    또 받은 정보가 있으면 보내 주세요.
  질문: |-
    궁금한 점에 직접 답해 드리진 못해요.
    받은 영상이나 글을 보내 주시면 확인해 드려요.
  무관: |-
    건강 정보가 담긴
    영상 주소나 글을 보내 주세요.
