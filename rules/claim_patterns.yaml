version: v0
# ════════════════════════════════════════════════════════════════════
# 주장 표현 패턴 — ③ 주장 구조화 단계에서 씁니다
#
# 자막 문장에서 '무엇이 무엇에 좋다고 말하는가'를 찾아내는 데 쓰는 표현 목록입니다.
# 의료 자문의 검수 대상입니다. 빠진 표현이 있으면 추가해 주세요.
# ════════════════════════════════════════════════════════════════════

# ────────────────────────────────────────────────────────────────────
# 질병 치료·완치 표현
# 이 표현이 하나라도 있으면 다른 조건과 무관하게 '주의하세요'로 갑니다(R-021).
# 국내법상 질병을 낫게 한다고 광고할 수 있는 식품은 없기 때문입니다.
# ────────────────────────────────────────────────────────────────────
# '치료'만으로는 잡지 않습니다. 실제 블로그 글에서 "마이크로바이옴 치료제"
# 같은 명사가 걸려 식품 글이 '주의하세요'로 판정됐습니다. 병이 낫는다는
# 뜻으로 쓰인 형태만 적습니다.
질병_치료_표현:
  - 완치
  - 치료된
  - 치료됩니
  - 치료한다
  - 치료해 드립
  - 치료가 됩니
  - 낫는다
  - 낫는
  - 낫게
  - 낫습니
  - 나았
  - 낫다
  - 없어진다
  - 사라진다
  - 없앤다
  - 제거된다
  - 고친다
  - 특효
  - 만병통치
  - 완치시킨

# ────────────────────────────────────────────────────────────────────
# 부정·반박 표현
#
# 오정보를 바로잡는 글을 오정보로 판정하지 않기 위한 목록입니다.
# 이 표현이 문장에 있으면 그 문장의 주장과 질병 표현을 인정하지 않습니다.
#
# 실제 블로그 글에서 아래 문장들이 '주의하세요'를 유발했습니다.
#   "홍삼이 만병통치약은 아니며, 약물 복용 시 주의가 필요합니다"
#   "홍삼이 만병통치약처럼 팔리지만, 솔직히 그건 과장입니다"
#   "홍삼을 먹으면 암이 낫는다는 얘기가 절대 아니에요"
# 세 문장 모두 오정보를 바로잡는 문장인데 오정보로 판정됐습니다.
#
# 대가가 있습니다. 부정 표현이 섞인 문장에서는 진짜 주장도 놓칩니다.
# "낫는다는 보장은 없지만 드셔 보세요" 같은 문장이 그렇습니다.
# 오판보다 판정 보류가 안전하다는 원칙에 따라 이 방향을 택했습니다.
# ────────────────────────────────────────────────────────────────────
부정_표현:
  - 아닙니다
  - 아니며
  - 아니라
  - 아니에요
  - 아니다
  - 아니고
  - 아닌
  - 과장
  - 거짓
  - 근거 없
  - 근거가 없
  - 사실이 아니
  - 오해
  - 입증되지 않
  - 확인되지 않
  - 검증되지 않
  - 밝혀지지 않
  - 잘못된 정보
  - 가짜

# ────────────────────────────────────────────────────────────────────
# 효능 표현 — 주장하는 효능을 찾는 단서입니다
# 강도에 따라 세 단계로 나눕니다.
#   ASSERTIVE  단정   '낫는다', '없어진다'
#   SUGGESTIVE 완화   '도움이 된다', '좋다'
#   UNCERTAIN  추측   '한다고 한다', '알려져 있다'
# ────────────────────────────────────────────────────────────────────
효능_표현:
  ASSERTIVE:
    - 낫는다
    - 없어진다
    - 사라진다
    - 확실하다
    - 반드시
    - 무조건
    - 즉시
  SUGGESTIVE:
    - 도움이 된다
    - 도움을 준다
    - 도움을 줄
    - 좋다
    - 좋아진다
    - 좋아졌
    - 좋아요
    - 개선
    - 효과가 있다
    - 유익하다
  UNCERTAIN:
    - 한다고 한다
    - 알려져 있다
    - 라고 합니다
    - 카더라
    - 그렇다는

# ────────────────────────────────────────────────────────────────────
# 범위 밖 표현
# 의약품, 시술, 질병 진단에 관한 내용이면 판정하지 않고 거절합니다(R-001).
#
# 두 단계로 나눕니다. 실제 8천 자 자막에서 "병원에 가", "처방" 같은 표현이
# 곁가지로 한 번 나와 홍삼 영상이 통째로 거절되는 일이 있었습니다.
#
#   즉시_거절  약을 끊으라거나 의약품을 대체하라는 표현입니다.
#              자막 어디에 한 번만 나와도 거절합니다. 가장 위험합니다.
#   문맥_판단  의료 이야기에 흔히 등장하는 단어입니다. 성분 주장이 담긴
#              문장 안에 함께 있을 때만 거절합니다.
# ────────────────────────────────────────────────────────────────────
범위_밖_표현:
  # 즉시_거절 — 의약품·치료를 대체하라고 권하는 표현입니다.
  # 자막이나 본문 어디에 한 번만 나와도 거절합니다.
  #
  # 약 이름 하나만으로 거절하지 않습니다. 실제 블로그 글에서 "처방약과 함께
  # 드실 때는 주의하세요", "항암제 치료 중이라면 상담하세요" 같은 책임 있는
  # 문장이 거절을 유발했습니다. 이런 글은 오히려 판정해 줘야 하는 식품 글입니다.
  # 그래서 '대체를 권하는 어구'만 여기에 둡니다.
  즉시_거절:
    - 약 끊
    - 약을 끊
    - 약 대신
    - 약을 줄
    - 약 줄이
    - 약 안 먹어도
    - 인슐린 안 맞
    - 인슐린 대신
    - 항암제 대신
    - 처방약 대신
    - 수술 대신
    - 시술 대신
    - 병원 안 가
    - 병원 갈 필요
    - 검사 결과보다
  # 문맥_판단 — 의료 이야기에 흔히 나오는 단어입니다.
  # 성분 주장이 담긴 문장 안에 함께 있을 때만 거절합니다.
  문맥_판단:
    - 처방
    - 항생제
    - 진통제
    - 항암제
    - 스테로이드
    - 인슐린
    - 복용량
    - 수술
    - 시술
    - 주사
    - 링거
    - 도수치료
    - 침술
    - 진단
    - 검사 결과
    - 판정받
    - 병원에 가

# ────────────────────────────────────────────────────────────────────
# 효능 대상 — 주장이 겨누는 신체 기능이나 질병명입니다
# 질병명이 대상이면 질병 치료 표현과 결합될 가능성이 높습니다.
# TODO(확인필요): 이 목록은 초안입니다. 의료 자문의 검수가 필요합니다.
# ────────────────────────────────────────────────────────────────────
효능_대상:
  질병명:
    - 당뇨
    - 고혈압
    - 암
    - 치매
    - 관절염
    - 골다공증
    - 뇌졸중
    - 심장병
    - 간염
    - 백내장
  신체기능:
    - 면역력
    - 혈당
    - 혈압
    - 콜레스테롤
    - 혈액순환
    - 기억력
    - 관절
    - 눈
    - 간
    - 장
    - 피로
