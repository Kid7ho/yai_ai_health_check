# ════════════════════════════════════════════════════════════════════
# 주장 표현 패턴 — ③ 주장 구조화 단계에서 씁니다
#
# 자막 문장에서 '무엇이 무엇에 좋다고 말하는가'를 찾아내는 데 쓰는 표현 목록입니다.
# 의료 자문의 검수 대상입니다. 빠진 표현이 있으면 추가해 주세요.
# ════════════════════════════════════════════════════════════════════

# ────────────────────────────────────────────────────────────────────
# 질병 치료·완치 표현
# 이 표현이 하나라도 있으면 다른 조건과 무관하게 '주의하세요'로 갑니다(R-021).
# 국내법상 질병을 낫게 한다고 광고할 수 있는 식품은 없기 때문입니다.
# ────────────────────────────────────────────────────────────────────
# '치료'만으로는 잡지 않습니다. 실제 블로그 글에서 "마이크로바이옴 치료제"
# 같은 명사가 걸려 식품 글이 '주의하세요'로 판정됐습니다. 병이 낫는다는
# 뜻으로 쓰인 형태만 적습니다.
질병_치료_표현:
  - 완치
  - 치료된
  - 치료됩니
  - 치료한다
  - 치료해 드립
  - 치료가 됩니
  - 낫는다
  - 낫는
  - 낫게
  - 낫습니
  - 나았
  - 낫다
  - 없어진다
  - 사라진다
  - 없앤다
  - 제거된다
  - 고친다
  - 특효
  - 만병통치
  - 완치시킨

# 질병 치료 어간 — 활용형이 많은 동사는 어간으로 잡되, 같은 문장에 질병 이름이 있을 때만 인정합니다.
#
# 위 목록은 '사라진다', '없앤다'처럼 한 가지 활용형만 담아 실제 제목의 "암이 사라집니다",
# "당뇨병을 없애주는", "암세포를 죽이는"을 놓쳤습니다(2026-09-17 실제 링크 점검).
# 어간은 "피로가 싹 사라집니다", "주름이 없어져요"처럼 질병이 아닌 말에도 붙으므로
# 질병 이름이 함께 있어야 질병 치료 표현으로 봅니다.
# ⚠ 개발자 판단입니다. 자문의 검수 대상입니다.
질병_치료_어간:
  - 사라지
