# ════════════════════════════════════════════════════════════════════
# 응답 문구 금지 표현 — ⑥ 응답 생성에서 검사합니다
#
# 이 서비스는 진단하지 않습니다. 결과는 진단이 아니라 근거 제시입니다.
# 면책 문구가 붙는지는 이미 강제하고 있지만, 카드 본문 자체가 진단처럼
# 읽히면 면책 문구만으로는 부족합니다.
#
# 그래서 어르신에게 나가는 문구에 아래 표현이 섞이는지 검사합니다.
# 금지 표현이 발견되면 그 문구를 내보내지 않고, 라벨과 면책 문구만 담은
# 안전한 응답으로 바꾸고 오류 로그를 남깁니다.
#
# 금지 표현이 나올 수 있는 경로는 규칙표의 근거 문장입니다. 자문의가 검수
# 중에 "치료됩니다" 같은 표현을 쓰면 그대로 어르신에게 전달되기 때문입니다.
# ════════════════════════════════════════════════════════════════════

# 우리가 진단·처방하는 것처럼 읽히는 표현
금지_표현:
  # 진단 행위로 읽히는 것
  - 진단합니다
  - 진단됩니다
  - 진단 결과
  - 의심됩니다
  - 확진
  # 처방·복약 지시로 읽히는 것
  - 처방
  - 복용하세요
  - 복용을 중단
  - 드시지 마세요
  - 끊으세요
  - 용량을 늘리
  - 용량을 줄이
  # 치료 효과를 단정하는 것
  - 치료됩니다
  - 완치됩니다
  - 낫습니다
  - 나을 수 있습니다
  - 효과가 확실합니다
  # 병원 진료를 대체하는 것처럼 읽히는 것
  - 병원에 가지 않아도
  - 병원 갈 필요 없

# 위 표현을 포함하더라도 허용하는 문장입니다.
# 면책 문구와, 진단이 아님을 설명하는 문장이 여기 들어갑니다.
허용_예외:
  - 이 결과는 참고용이며 진단이 아닙니다.
  - 약이나 치료에 관한 것은 꼭 의사 선생님께 물어보세요.
