version: v0
# ════════════════════════════════════════════════════════════════════
# 권위 역할 표현 — 근거 화면에 "언급된 전문가 역할"로 표시합니다
#
# "의사가 알려주는", "약사가 추천하는" 같은 표현은 건강 오정보에서 흔히
# 신뢰를 끌어오는 장치로 쓰입니다. 어르신이 그 사실을 알아볼 수 있게
# 보여 줍니다. 판정에는 쓰지 않습니다.
#
# 역할만 찾고 실명은 찾지 않습니다. "김철수 박사" 같은 실명은 규칙으로
# 정확히 뽑을 수 없습니다. 실제 그 역할의 인물인지도 확인하지 않습니다.
# 근거 화면 문구에도 그 사실을 함께 적습니다.
#
# 긴 표현을 먼저 찾습니다. "한의사"가 "의사"로 잡히지 않게 합니다.
# ════════════════════════════════════════════════════════════════════

역할:
  - 한의사
  - 치과의사
  - 전문의
  - 의사
  - 약사
  - 한약사
  - 간호사
  - 영양사
  - 교수
  - 박사
  - 원장
  - 연구원
  - 연구팀

# "의사"는 '뜻'이라는 다른 의미로도 쓰입니다. 뒤에 이 말이 오면 역할로 보지 않습니다.
제외_뒤따름:
  의사:
    - 결정
    - 소통
    - 표현
    - 표시
  박사:
    - 과정
    - 학위
