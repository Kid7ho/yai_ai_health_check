version: v0
# ════════════════════════════════════════════════════════════════════
# 고시형 기능성원료 목록  ⚠ 검수 전 초안입니다
#
# 식약처 오픈API I-0040은 개별인정형 원료만 담습니다. 홍삼, 프로바이오틱스
# 같은 고시형 원료는 건강기능식품 공전이 출처이며 API로 제공되지 않습니다.
# 이 파일이 없으면 고시형 원료 주장이 전부 '알 수 없어요'가 됩니다.
#
# ⚠ 아래 기능성 문구는 공전 원문을 대조하지 않은 초안입니다.
#
# 공전 원문은 공개 API로 받을 수 없습니다. 확인한 결과는 이렇습니다.
#   · 식약처 오픈API I-0040(773건)과 I-0050(447건)은 모두 개별인정형입니다.
#     둘 다 인정번호가 있고 고시형에는 인정번호가 없습니다.
#   · 법제처 API로 고시 「건강기능식품의 기준 및 규격」을 받으면 조문 내용이
#     "자세한 내용은 상단 메뉴 버튼을 이용하십시오"로만 나옵니다.
#     실제 표는 첨부파일(한글·PDF)입니다.
#   · C002(품목제조신고)에는 기능성 문구가 없습니다.
#
# 그래서 사람이 공전 첨부파일에서 표를 뽑아 주어야 합니다. 표를 받으면
# 아래 명령으로 이 파일을 다시 생성하십시오. 손으로 고치지 마십시오.
#
#     python scripts/import_notified.py 공전표.tsv
#
# 생성 후 기능성 내용이 공전 원문과 일치하는지 의료 자문의가 확인하고
# 검수완료를 true로 바꿉니다. 그때까지 이 데이터로 나온 판정에는 조회
# 로그에 경고가 남습니다.
# ════════════════════════════════════════════════════════════════════

검수완료: false

원료:
  홍삼:
    기능성_내용: 면역력 증진·피로 개선에 도움을 줄 수 있음
    효능_대상: [면역력, 피로]
  프로바이오틱스:
    기능성_내용: 유산균 증식 및 유해균 억제, 배변활동 원활에 도움을 줄 수 있음
    효능_대상: [장]
  루테인:
    기능성_내용: 노화로 인해 감소될 수 있는 황반색소밀도를 유지하여 눈 건강에 도움을 줄 수 있음
    효능_대상: [눈]
  오메가3:
    기능성_내용: 혈중 중성지질 개선·혈행 개선에 도움을 줄 수 있음
    효능_대상: [혈액순환, 콜레스테롤]

# 아래 성분은 이 목록에 넣지 않는다.
#   밀크씨슬  개별인정형이다. I-0040 조회로 처리된다
#   마늘·블루베리·강황  기능성 원료가 아니다. I-0040에도 없으면
#                      조회 결과가 NOT_RECOGNIZED로 나온다
# 고시형이 아닌 성분을 이 목록에 넣으면 인정 유형이 잘못 기록된다.
