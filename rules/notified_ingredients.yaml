# 기능성_내용은 I2710의 PRIMARY_FNCLTY에서 번호·일일섭취량·단서 문구를 걷어낸 것이다.
# 공전 원문(식약처 건강기능식품 종합정보 서비스)과 사람이 대조하기 전까지
# 검수완료는 false이고, 이 데이터로 나온 판정에 경고 로그가 남는다.
# ════════════════════════════════════════════════════════════════════

