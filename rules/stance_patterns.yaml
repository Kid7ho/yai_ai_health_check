version: v0
# ════════════════════════════════════════════════════════════════════
# 논문 찬반 판정 표현 — ④-A 학술 검증에서 씁니다
#
# Liner Scholar 응답에는 "이 논문이 주장을 뒷받침하는가"를 알려주는 필드가
# 없습니다. 제목과 초록에 나타나는 표현으로 우리가 판단해야 합니다.
#
# 이 판정은 거칠 수밖에 없습니다. 아래 원칙을 따릅니다.
#   · 반박 표현을 먼저 봅니다. 논문 제목에 부정문이 섞이면 뒷받침이 아닙니다
#   · 어느 쪽에도 걸리지 않으면 NEUTRAL입니다. 뒷받침으로 세지 않습니다
#     판단 불가를 뒷받침으로 세면 보수적 기본값 원칙이 무너집니다
#
# 의료 자문의 검수 대상입니다. 빠진 표현이 있으면 추가해 주세요.
# ════════════════════════════════════════════════════════════════════

# 주장을 반박하거나 근거가 부족하다고 말하는 표현
반박_표현:
  - no evidence
  - no significant
  - not associated
  - no association
  - not effective
  - no effect
  - lack of evidence
  - insufficient evidence
  - inconclusive
  - does not
  - did not
  - fails to
  - failed to
  - no benefit
  - unproven
  - misleading
  - myth
  - retracted
  - 근거 없
  - 효과 없
  - 유의하지 않

# 주장을 뒷받침하는 표현
뒷받침_표현:
  - improve
  - improved
  - improvement
  - reduce
  - reduced
  - reduction
  - increase
  - increased
  - beneficial
  - benefit
  - effective
  - efficacy
  - significant
  - significantly
  - enhance
  - enhanced
  - ameliorate
  - protective
  - associated with
  - 개선
  - 유의하게
  - 감소
  - 증가

# ────────────────────────────────────────────────────────────────────
# 제외 표현 — 검색 결과에서 걸러 낼 문헌
#
# Liner Scholar는 특허와 제조법 문헌도 함께 돌려줍니다. "블루베리
# 안토시아닌 추출 방법" 특허는 "블루베리가 당뇨에 좋다"는 주장의 근거가
# 아닙니다. 이런 문헌이 뒷받침 논문으로 세어지면 판정이 뒤집힙니다.
# ────────────────────────────────────────────────────────────────────
제외_표현:
  - method for preparing
  - method for extracting
  - method for producing
  - method of preparing
  - method of producing
  - preparation method
  - production method
  - processing method
  - and preparation method thereof
  - manufacturing method
  - 제조 방법
  - 추출 방법
