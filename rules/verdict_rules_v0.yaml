version: v0.9
# ════════════════════════════════════════════════════════════════════
# 판정 규칙표 v0 — 수원 소재 병원 의료 자문의 검수용
#
# 이 파일만 보고 검수할 수 있도록 만들었습니다. 코드를 읽지 않아도 됩니다.
# 위에서 아래로 순서대로 확인하고, 처음 일치한 규칙에서 멈춥니다.
# 어떤 규칙에도 일치하지 않으면 맨 아래 기본 규칙이 '알 수 없어요'를 돌려줍니다.
#
# 결과는 네 가지뿐입니다.
#   TRUSTWORTHY  믿을 만해요
#   CAUTION      조심하세요
#   WARNING      주의하세요
#   UNKNOWN      알 수 없어요
#
# 수정 의견은 규칙 ID(R-0xx)를 적어 주시면 됩니다.
#
# 규칙마다 문장이 둘입니다.
#   근거  검수용입니다. 왜 이 결과로 가는지 자문의가 판단하도록 적었습니다.
#   안내  어르신에게 보이는 문장입니다. 짧고 쉬운 말로 적습니다.
# 이전에는 근거 문장이 결과 카드에 그대로 나가, "보수적 기본값입니다" 같은
# 검수용 설명이 어르신 화면에 보였습니다.
# ════════════════════════════════════════════════════════════════════

# ────────────────────────────────────────────────────────────────────
# 판정에 쓰이는 값들의 뜻
# ────────────────────────────────────────────────────────────────────
# in_scope                 음식·식품·건강기능식품에 관한 내용인가 (예/아니오)
#                          의약품, 시술, 질병 진단은 이 서비스의 범위가 아닙니다
# transcript_quality       영상 자막을 확보했는가
#                            none 자막 없음 / low 신뢰도 미달 / ok 사용 가능
# disease_cure_expression  '완치·치료·낫는다·없어진다' 같은 질병 치료 표현이 있는가
# ad_violation_hit         식약처 부당광고 적발 이력에 해당하는 제품·표현인가
#                          ⚠ 전용 오픈API를 확보하지 못해 현재는 항상 '아니오'입니다.
#                          그래서 R-020과 R-030은 지금 발동하지 않습니다.
# prohibited_ad_expression 「식품 등의 표시·광고에 관한 법률」이 금지하는 광고
#                          표현을 쓰고 있는가. 적발 기록 조회가 아니라 표현
#                          매칭 결과입니다. 목록은 ad_violation_patterns.yaml
# recognition              식약처가 기능성 원료로 인정했는가
#                            INDIVIDUAL     개별인정형 원료
#                            NOTIFIED       고시형 원료
#                            NOT_RECOGNIZED 인정된 기능성 원료가 아님
#                            UNKNOWN        조회 실패 또는 성분 특정 불가
# functionality_match      주장하는 효능이 국가가 인정한 기능성 문구와 맞는가
#                            EXACT          완전히 같음
#                            PARTIAL        일부만 겹치거나 인정 범위보다 넓게 말함
#                            MISMATCH       인정 문구와 전혀 다름
#                            NOT_APPLICABLE 인정 원료가 아니어서 비교 불가
# supporting_papers        주장을 뒷받침하는 논문 수
# refuting_papers          주장을 반박하는 논문 수
# 반박논문_우세             반박 논문이 뒷받침 논문보다 아래 기준만큼 많은 상태

# ────────────────────────────────────────────────────────────────────
# 임계값 — 숫자 기준을 한곳에 모았습니다. 여기만 고쳐도 됩니다.
# ────────────────────────────────────────────────────────────────────
임계값:
  # 반박 논문이 뒷받침 논문보다 이 수만큼 많으면 '반박논문_우세'로 봅니다
  반박논문_우세_기준: 2
  # '믿을 만해요'를 주려면 뒷받침 논문이 최소 몇 편 필요한가
  신뢰_최소_뒷받침논문: 1
  # '믿을 만해요'를 주려면 뒷받침 논문이 반박 논문의 몇 배여야 하는가
  # 반박이 0편이면 이 조건은 자동으로 만족합니다
  신뢰_뒷받침_배수: 2
  # 자막 신뢰도가 이 값보다 낮으면 판정을 보류합니다 (0.0 ~ 1.0)
  자막_신뢰도_최저: 0.6
  # 국가 인정이 없는 성분에 '조심하세요'를 주려면 뒷받침 논문이 몇 편 필요한가
  # 반박 논문이 섞여 있어도 이 수를 넘으면 연구가 여러 편 있다고 봅니다
  다수연구_최소_뒷받침논문: 2

# ────────────────────────────────────────────────────────────────────
# 규칙 — 위에서 아래 순서로 확인합니다
# ────────────────────────────────────────────────────────────────────
규칙:
  - id: R-001
    설명: 의약품·시술·질병 진단에 관한 내용은 이 서비스의 범위가 아닙니다
    조건:
      in_scope: false
    결과: UNKNOWN
    안내: 음식이나 건강기능식품 이야기가 아니라서 확인해 드리지 않아요.
    근거: >-
      서비스 범위를 음식·식품·건강기능식품으로 한정했습니다.
      범위 밖 내용은 판정하지 않고 거절합니다.

  - id: R-010
    설명: 자막이 없거나 글자가 부실해서 무슨 주장인지 알 수 없는 경우
    조건:
      transcript_quality: [none, low]
    결과: UNKNOWN
    안내: 영상 내용을 글로 확인하지 못해서 판단하기 어려워요.
    근거: >-
      근거가 되는 원문을 확보하지 못한 상태에서 판정하면 오판 위험이 큽니다.
      이번 단계는 자막이 있는 영상만 지원합니다.

  - id: R-020
    설명: 병을 낫게 한다는 표현이 있고, 부당광고로 적발된 이력까지 있는 경우
    조건:
      disease_cure_expression: true
      ad_violation_hit: true
    결과: WARNING
    안내: 병이 낫는다고 말하고, 나라에서 잘못된 광고로 적발한 기록도 있어요.
    근거: >-
      질병 치료 표현과 국가의 실제 적발 기록이 함께 확인된,
      가장 위험한 경우입니다.

  - id: R-021
    설명: 병을 낫게 한다는 표현이 있으면 다른 조건과 무관하게 주의입니다
    조건:
      disease_cure_expression: true
    결과: WARNING
    안내: 식품은 병을 낫게 한다고 광고할 수 없어요. 병이 낫는다는 말은 믿지 마세요.
    근거: >-
      국내법상 질병을 낫게 한다고 광고할 수 있는 식품은 없습니다.
      국가가 인정한 기능성 원료라 해도 예외가 아닙니다.

  - id: R-030
    설명: 질병 표현은 없지만 부당광고 적발 이력에 해당하는 제품·표현인 경우
    조건:
      ad_violation_hit: true
    결과: WARNING
    안내: 나라에서 잘못된 광고로 적발한 표현이에요.
    근거: 국가가 이미 위반으로 판단한 표현입니다.

  - id: R-031
    설명: 법으로 금지된 광고 표현을 쓰는 경우
    조건:
      prohibited_ad_expression: true
    결과: WARNING
    안내: 법으로 금지된 광고 표현이 들어 있어요. 과장되었거나 사실과 다를 수 있어 그대로 믿기 어려워요.
    근거: >-
      「식품 등의 표시·광고에 관한 법률」이 금지하는 표현입니다. 의약품으로
      오인하게 하는 표현, 부작용이 없다거나 누구에게나 효과가 있다는 거짓·과장
      표현, 식약처가 보증한다는 허위 표현이 여기 해당합니다.
      개인 체험기는 여기에 넣지 않습니다. 광고가 아닌 시민의 공유 글에도
      흔히 나오기 때문입니다. 체험기가 질병 완치를 말하면 R-021이 잡습니다.
      식약처 적발 기록을 조회한 것이 아니라 표현을 확인한 결과입니다.
      적발 이력 조회용 전용 오픈API를 아직 확보하지 못했습니다.

  - id: R-040
    설명: 국가가 인정한 원료이고, 주장 효능이 인정 문구와 같고, 뒷받침 연구가 분명히 우세한 경우
    조건:
      recognition: [INDIVIDUAL, NOTIFIED]
      functionality_match: EXACT
      뒷받침_우세: true
    결과: TRUSTWORTHY
    안내: 나라가 인정한 기능성과 같고, 이를 뒷받침하는 연구도 있어요.
    근거: >-
      '믿을 만해요'는 국가 인정과 학술 근거가 모두 확인될 때만 줍니다.
      네 가지 결과 중 가장 좁은 조건입니다.
      반박 논문이 한 편도 없어야 한다는 조건은 쓰지 않습니다. 실제 학술
      검색은 어떤 주장이든 반박 논문을 한두 편 돌려주기 때문에, 그 조건으로는
      국가 인정 문구와 정확히 일치하는 주장까지 이 라벨에 도달하지 못합니다.
      대신 뒷받침 논문이 반박 논문의 두 배 이상일 것을 요구합니다.

  - id: R-042
    설명: 국가가 인정한 원료이고 주장 효능이 인정 문구와 같지만, 관련 논문을 하나도 찾지 못한 경우
    조건:
      recognition: [INDIVIDUAL, NOTIFIED]
      functionality_match: EXACT
      supporting_papers:
        최대: 0
      refuting_papers:
        최대: 0
    결과: CAUTION
    안내: 나라가 인정한 기능성과 같지만, 뒷받침하는 연구를 찾지 못했어요.
    근거: >-
      국가 인정은 확인됐지만 학술 근거가 없어 '믿을 만해요'를 주지 않습니다.
      이전에는 R-041로 떨어져 "학계에 이견이 있다"는 사실과 다른 설명이 나갔습니다.
      논문이 없는 것과 반박 논문이 있는 것은 다른 상황입니다.

  - id: R-041
    설명: 인정 원료이고 효능도 일치하지만, 반박하는 논문이 있는 경우
    조건:
      recognition: [INDIVIDUAL, NOTIFIED]
      functionality_match: EXACT
    결과: CAUTION
    안내: 나라가 인정한 기능성과 같지만, 연구 결과가 엇갈려요.
    근거: 국가 인정은 있으나 학계에 이견이 있으므로 단정하지 않습니다.

  - id: R-050
    설명: 인정 원료이지만 주장하는 효능이 인정 문구보다 넓거나 일부만 겹치는 경우
    조건:
      recognition: [INDIVIDUAL, NOTIFIED]
      functionality_match: PARTIAL
    결과: CAUTION
    안내: 나라가 인정한 내용보다 부풀려서 말하고 있어요.
    근거: >-
      인정된 내용보다 부풀려 말한 경우입니다.
      성분 자체는 문제가 없으므로 '주의하세요'까지는 가지 않습니다.

  # R-060은 현재 식약처 조회 구현에서는 발동하지 않습니다. 인정 여부를
  # (성분, 효능) 쌍으로 보게 바꾸면서, 주장 효능을 다루는 인정 건이 없으면
  # recognition을 NOT_RECOGNIZED로 내보내기 때문입니다. 다른 데이터 출처가
  # 불일치를 그대로 알려 주는 경우를 대비해 규칙은 남겨 둡니다.
  - id: R-060
    설명: 인정 원료이지만 주장하는 효능이 인정 문구와 전혀 다른 경우
    조건:
      recognition: [INDIVIDUAL, NOTIFIED]
      functionality_match: MISMATCH
    결과: WARNING
    안내: 나라가 인정한 것과 다른 효능을 말하고 있어요.
    근거: >-
      국가 인정 사실을 근거로 인정되지 않은 효능을 말하는 형태입니다.
      소비자가 오인할 위험이 큽니다.

  - id: R-070
    설명: 국가 인정 원료는 아니지만 뒷받침 논문이 있고 반박은 없는 경우
    조건:
      recognition: NOT_RECOGNIZED
      refuting_papers:
        최대: 0
      supporting_papers:
        최소: 1
    결과: CAUTION
    안내: 연구는 있지만 나라가 인정한 기능성은 아니에요.
    근거: >-
      연구는 있으나 국가가 기능성을 인정한 단계가 아닙니다.
      '믿을 만해요'라고 말할 수 없습니다.

  - id: R-071
    설명: 국가 인정은 없지만 뒷받침 논문이 반박 논문보다 분명히 많은 경우
    조건:
      recognition: NOT_RECOGNIZED
      supporting_papers:
        최소: 다수연구_최소_뒷받침논문
      반박논문_우세: false
    결과: CAUTION
    안내: 연구는 여러 편 있지만 반대 결과도 있고, 나라가 인정한 기능성은 아니에요.
    근거: >-
      연구가 여러 편 있으나 국가가 기능성을 인정한 단계가 아닙니다.
      반박 연구도 함께 있으므로 '믿을 만해요'라고 말할 수 없습니다.
      실제 학술 검색에서는 어떤 주장이든 반박 논문이 한두 편은 거의 항상
      나오기 때문에, 반박이 0편이어야 하는 R-070만으로는 국가 인정이 없는
      성분이 거의 전부 '알 수 없어요'로 떨어집니다.

  - id: R-080
    설명: 국가 인정도 없고 반박 논문이 뒷받침 논문보다 우세한 경우
    조건:
      recognition: NOT_RECOGNIZED
      반박논문_우세: true
    결과: WARNING
    안내: 나라가 인정하지 않았고, 연구에서도 효과가 없다는 결과가 더 많아요.
    근거: 국가 인정도 없고 학계 다수가 부정하는 주장입니다.

  - id: R-999
    설명: 위 어디에도 확실히 맞지 않는 모든 경우
    조건: {}
    결과: UNKNOWN
    안내: 확인할 수 있는 근거가 부족해서 판단을 미룰게요.
    근거: >-
      보수적 기본값입니다. 잘못 판정하는 것보다 판정을 보류하는 편이
      훨씬 안전합니다. 이것이 네 번째 결과가 존재하는 이유입니다.
