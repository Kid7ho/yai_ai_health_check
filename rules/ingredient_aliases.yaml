version: v0
# ════════════════════════════════════════════════════════════════════
# 성분명 정규화 사전 — ③ 주장 구조화 단계에서 씁니다
#
# 어르신이 받는 영상은 같은 성분을 여러 이름으로 부릅니다.
# 왼쪽이 표준 이름, 오른쪽이 같은 것을 가리키는 다른 표기입니다.
# 표준 이름은 식약처 기능성 원료인정 현황의 신청원료명(APLC_RAWMTRL_NM)
# 표기에 맞추는 것을 목표로 합니다.
#
# TODO(확인필요): 식약처 데이터 원본을 아직 받지 못했습니다. 원본을 받으면
# 표준 이름을 실제 APLC_RAWMTRL_NM 값과 대조해 교정해야 합니다.
# 지금 값은 골든 테스트를 돌리기 위한 최소 씨앗 사전입니다.
# ════════════════════════════════════════════════════════════════════

성분:
  홍삼:
    - 고려홍삼
    - 홍삼정
    - 홍삼농축액
    - 6년근 홍삼
  프로바이오틱스:
    - 유산균
    - 락토바실러스
    - 비피더스
  블루베리:
    - 냉동 블루베리
    - 블루베리 분말
    - 와일드 블루베리
  오메가3:
    - EPA
    - DHA
    - 오메가-3
    - 피쉬오일
    - 어유
  밀크씨슬:
    - 실리마린
    - 카르두스 마리아누스
    - 흰무늬엉겅퀴
  루테인:
    - 마리골드 추출물
    - 루테인지아잔틴
  강황:
    - 커큐민
    - 터메릭
  마늘:
    - 흑마늘
    - 마늘 추출물

# ────────────────────────────────────────────────────────────────────
# 영문 검색어
# 학술 논문은 대부분 영어로 쓰여 있습니다. 한국어 성분명으로 학술 검색을
# 하면 결과가 거의 나오지 않으므로, 검색에 쓸 영문 표기를 따로 둡니다.
# 여기에 없는 성분은 한국어 표기로 검색합니다.
# TODO(확인필요): 성분 사전을 넓힐 때 영문 표기도 함께 채워야 합니다.
# ────────────────────────────────────────────────────────────────────
영문명:
  홍삼: Korean red ginseng
  프로바이오틱스: probiotics
  블루베리: blueberry anthocyanin
  오메가3: omega-3 fatty acids
  밀크씨슬: milk thistle silymarin
  루테인: lutein
  강황: curcumin
  마늘: garlic

