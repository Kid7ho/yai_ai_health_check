# ════════════════════════════════════════════════════════════════════
# 성분명 정규화 사전 — ③ 주장 구조화 단계에서 씁니다
#
# 어르신이 받는 영상은 같은 성분을 여러 이름으로 부릅니다.
# 왼쪽이 표준 이름, 오른쪽이 같은 것을 가리키는 다른 표기입니다.
# 표준 이름은 식약처 기능성 원료인정 현황의 신청원료명(APLC_RAWMTRL_NM)
# 표기에 맞추는 것을 목표로 합니다.
#
# TODO(확인필요): 식약처 데이터 원본을 아직 받지 못했습니다. 원본을 받으면
# 표준 이름을 실제 APLC_RAWMTRL_NM 값과 대조해 교정해야 합니다.
# 지금 값은 골든 테스트를 돌리기 위한 최소 씨앗 사전입니다.
# ════════════════════════════════════════════════════════════════════

# 앞말_붙으면_제외 — 이 성분명 바로 앞에 한글이 붙어 있으면 성분으로 보지 않습니다.
# "여주"가 "줄여주고", "보여주는", "높여주는" 같은 동사 안에서 잡혀 크릴오일 기사에서 여주 주장이 생겼습니다.
# 실제 글 45건을 훑었을 때 앞에 한글이 붙어 잘못 잡힌 성분은 여주뿐이었고, 생마늘·흑마늘·저분자콜라겐처럼
# 붙어 쓰는 표기가 흔한 성분은 넣지 않습니다(2026-09-17).
앞말_붙으면_제외:
  - 여주

성분:
  홍삼:
    - 고려홍삼
    - 홍삼정
    - 홍삼농축액
    - 6년근 홍삼
  프로바이오틱스:
    - 유산균
    - 락토바실러스
    - 비피더스
  블루베리:
    - 냉동 블루베리
    - 블루베리 분말
    - 와일드 블루베리
  오메가3:
