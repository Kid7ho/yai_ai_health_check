    - 마늘 추출물

  # ── 2026-09-13 확장 ──────────────────────────────────────────────
  # 실제 블로그·뉴스·자막 8건에 나온 원료 14종 중 4종만 잡혔다. 흔한 원료를 추가한다.
  # 식약처 신청원료명(예: "루테인복합물VBAF")은 제품 단위 이름이라 본문 표현과
  # 맞지 않아서, 사람들이 실제로 부르는 이름을 표준명으로 쓴다.
  #
  # TODO(검수필요): 인삼과 진세노사이드를 홍삼과 합치지 않았다. 인삼과 홍삼은
  # 가공 방식과 인정 기능성이 다를 수 있어 따로 둔다. 자문의 판단에 따라 합칠 수 있다.
  # 두 글자 이름(여주, 녹차 등)은 다른 단어 안에서 잡힐 수 있다. 다만 주장이 되려면
  # 같은 문장에 효능 표현이 있어야 하므로 오탐이 판정까지 가는 경우는 드물다.
  인삼:
