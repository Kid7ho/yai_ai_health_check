# ────────────────────────────────────────────────────────────────────
# 영문 검색어
# 학술 논문은 대부분 영어로 쓰여 있습니다. 한국어 성분명으로 학술 검색을
# 하면 결과가 거의 나오지 않으므로, 검색에 쓸 영문 표기를 따로 둡니다.
# 여기에 없는 성분은 한국어 표기로 검색합니다.
# TODO(확인필요): 성분 사전을 넓힐 때 영문 표기도 함께 채워야 합니다.
# ────────────────────────────────────────────────────────────────────
# 영문명_대체 — 위 영문명으로 찾은 논문 중 관련 논문이 0편일 때 한 번 더 찾는 표기입니다.
# 운영 실측(2026-09-17): "Korean red ginseng fatigue"는 홍삼 품질·성분 논문만 돌려줘 관련 0편이었고,
# "red ginseng fatigue"는 관련 4편이었습니다. 수식어가 붙은 영문명에만 둡니다.
# 인삼(ginseng) 같은 다른 원료로 넓히지 않습니다. 홍삼 주장에 인삼 논문을 쓰지 않기 위해서입니다.
영문명_대체:
  홍삼: red ginseng
  블루베리: blueberry
  오메가3: fish oil omega-3
  밀크씨슬: silymarin
  녹차: green tea
  강황: turmeric
  철분: iron
  콜라겐: collagen

# ────────────────────────────────────────────────────────────────────
# 비타민_표기 — 논문이 이 비타민을 다루는지 볼 때 "vitamin X" 말고도 인정하는 표기입니다.
# 비타민은 이름 앞부분이 같아서 앞 5글자(vitam)로 찾으면 다른 비타민 논문이 섞입니다.
# 실측(2026-09-18): 비타민B 전립선 주장에 "Vitamin D in prostate cancer" 등 8편이 관련 논문으로 들어왔습니다.
# 그래서 "vitamin D", "vitamin D3", "D vitamins"처럼 글자까지 맞아야 하고, 아래 표기도 인정합니다.
# ⚠ 개발자 판단이다. 자문의 검수 대상이다.
# ────────────────────────────────────────────────────────────────────
비타민_표기:
  c: [ascorbic acid, ascorbate]
  d: [cholecalciferol, ergocalciferol, calcitriol, 25(oh)d, 25-hydroxyvitamin d]
  b: [b-complex, thiamine, riboflavin, niacin, pyridoxine, cobalamin]

