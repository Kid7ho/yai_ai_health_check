# ────────────────────────────────────────────────────────────────────
# 효능_제목_표현 — 논문이 이 효능을 다루는지 판단할 때 제목에서 찾는 표현
#
# 초록에만 효능 단어가 있는 논문은 근거로 세지 않는다. 실측에서 "Rg3 홍삼이
# 고혈압 쥐의 혈관 기능을 개선"한 논문이 초록의 면역 언급 때문에 면역력 주장의
# 뒷받침으로 세어졌다. 제목만 보면 같은 뜻의 다른 표기(blood pressure와
# hypertension)를 놓치므로 여기 적은 표현 중 하나라도 제목에 있으면 관련으로 본다.
# 한 표현 안의 단어는 모두 있어야 한다. 4글자 이상 단어는 앞 5글자로 찾고
# 3글자 이하(eye, gut)는 단어 전체로 찾는다.
# 목록에 없는 효능은 health·function 같은 일반어를 뺀 단어가 모두 있어야 한다.
# ⚠ 개발자 판단이다. 자문의 검수 대상이다.
