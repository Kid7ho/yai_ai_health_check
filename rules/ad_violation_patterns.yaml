version: v0
# ════════════════════════════════════════════════════════════════════
# 부당광고 표현 목록 — ③ 주장 구조화에서 검사합니다
#
# ⚠ 이것은 식약처 적발 기록 조회가 아닙니다.
#
# 부당광고 적발 정보 전용 오픈API를 찾지 못했습니다. 확인한 결과입니다.
#   · 식품안전나라 오픈API를 훑어봤으나 행정처분·부당광고 서비스가 없습니다.
#     I0490(회수·판매중지)의 회수 사유는 "세균수 부적합", "잔류농약 기준
#     초과"처럼 규격 위반이고 광고 위반이 아닙니다.
#   · 공공데이터포털의 행정처분결과(식품판매업)가 유일한 대체 후보인데,
#     활용신청 전에는 응답 필드명을 확인할 수 없습니다. 필드명을 지어내지
#     않기로 했으므로 그 어댑터는 만들지 않았습니다.
#
# 그래서 접근을 바꿨습니다. 적발된 제품을 조회하는 대신, 「식품 등의 표시·
# 광고에 관한 법률」이 금지하는 표현 유형에 해당하는지 문장에서 확인합니다.
# 특정 업체의 적발 이력은 알 수 없지만, 금지된 표현을 쓰고 있다는 사실은
# 알 수 있습니다.
#
# 의료 자문의와 법률 검토가 필요한 파일입니다. 표현 하나가 '주의하세요'
# 판정을 만들기 때문입니다. 빠진 표현이나 과한 표현을 알려 주십시오.
#
# 질병 치료·완치 표현은 이 파일에 넣지 않습니다. claim_patterns.yaml의
# 질병_치료_표현이 담당하고 규칙 R-021이 먼저 잡습니다.
# ════════════════════════════════════════════════════════════════════

# ────────────────────────────────────────────────────────────────────
# 의약품으로 오인하게 하는 표현
# ────────────────────────────────────────────────────────────────────
의약품_오인:
  - 약보다 효과
  - 약보다 낫
  - 약이나 다름없
  - 약처럼 효과
  - 천연 항생제
  - 천연 치료제
  - 처방 없이도
  - 의약품과 같은
  - 의약품 수준

# ────────────────────────────────────────────────────────────────────
# 거짓 또는 과장된 표현
# ────────────────────────────────────────────────────────────────────
거짓_과장:
  # "부작용 걱정 없이 안전하게 섭취하는 방법" 같은 조언 문장이 걸렸다.
  # '없이'는 조언에도 쓰이므로 넣지 않고, 제품을 꾸미는 '없는'만 넣는다.
  - 부작용이 전혀 없
  - 부작용 걱정 없는
  - 부작용 없는 천연
  - 100% 효과
  - 백퍼센트 효과
  - 누구에게나 효과
  - 무조건 효과
  - 즉시 효과
  - 하루 만에
  - 일주일 만에 완
  - 세계 최초로 밝혀
  - 유일하게 인정
  - 기적의
  - 신약 수준

# ────────────────────────────────────────────────────────────────────
# 공적 인증을 거짓으로 내세우는 표현
#
# 식약처가 기능성을 인정한 원료라도 "식약처 공식 인증 제품" 같은 표현은
# 쓸 수 없습니다. 인정은 원료의 기능성에 대한 것이고 제품 품질 보증이
# 아니기 때문입니다.
# ────────────────────────────────────────────────────────────────────
공적_인증_오인:
  - 식약처 공식 인증
  - 식약처가 보증
  - 식약처 추천
  - 국가가 보증
  - 정부 인증 치료
  - 의사가 처방하는 건강식품
  - 병원에서 처방하는 건강식품

# ────────────────────────────────────────────────────────────────────
# 체험기 보증 유형은 넣지 않습니다 (2026-09-12 결정)
#
# "저는 이걸로 나았습니다" 같은 개인 후기는 광고가 아닌 일반 시민의 공유
# 글에도 흔히 나옵니다. 어르신이 지인에게 받은 메시지 상당수가 그런 형태입니다.
# 그것을 부당광고로 판정하면 광고가 아닌 글을 위반으로 표시하게 됩니다.
#
# 다만 질병이 나았다는 표현 자체는 claim_patterns.yaml의 질병_치료_표현이
# 담당하고 규칙 R-021이 잡습니다. 체험기 형태라도 "먹고 당뇨가 나았다"처럼
# 질병 완치를 말하면 그쪽에서 '주의하세요'로 갑니다.
# ────────────────────────────────────────────────────────────────────
