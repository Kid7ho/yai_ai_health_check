# 최초 예시 5건. 네 라벨과 주요 규칙 경로를 한 번씩 지나간다.
# 팀이 채워 넣을 때 참고용으로 남긴다.

- id: gold-001
  input: "냉동 블루베리가 당뇨를 완치시킨다"
  expected: WARNING
  expected_rule: R-021
  reason: 질병 완치 표현이 있고 해당 기능성 인정도 없다. 식품은 질병을 낫게 한다고 광고할 수 없다.
  판정입력:
    in_scope: true
    transcript_quality: ok
    disease_cure_expression: true
    ad_violation_hit: false
    recognition: NOT_RECOGNIZED
    functionality_match: NOT_APPLICABLE
    supporting_papers: 0
    refuting_papers: 0

- id: gold-002
  input: "홍삼이 면역력 증진에 도움을 줄 수 있다"
  expected: TRUSTWORTHY
  expected_rule: R-040
  reason: 고시형 기능성 원료이고 주장 효능이 인정 문구와 같으며 반박 논문이 없다.
  # TODO(확인필요): 홍삼은 고시형 원료이므로 식약처 I-0040(개별인정형)에는 없다.
  # 고시형 목록 데이터를 확보하기 전까지 recognition=NOTIFIED를 실제로 채울 수 없다.
  판정입력:
    in_scope: true
    transcript_quality: ok
    disease_cure_expression: false
    ad_violation_hit: false
    recognition: NOTIFIED
    functionality_match: EXACT
    supporting_papers: 3
    refuting_papers: 0

