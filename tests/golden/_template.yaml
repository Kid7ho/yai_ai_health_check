# 골든 케이스 템플릿. 이 파일 자체는 테스트로 실행되지 않는다.
# 복사해서 gold_<주제>.yaml로 만들어 쓴다. 형식 설명은 README.md 참고.

- id: gold-000
  input: "여기에 어르신이 공유한 원문을 적습니다"
  source_url:            # 선택. 유튜브 링크가 있으면 적습니다
  expected: UNKNOWN      # TRUSTWORTHY | CAUTION | WARNING | UNKNOWN
  expected_rule:         # 선택. 매칭될 규칙 ID (예: R-021)
  reason: "이 라벨이 나와야 하는 이유를 사람 말로 적습니다"
  판정입력:
    in_scope: true                        # 음식·식품·건강기능식품 내용인가
    transcript_quality: ok                # none | low | ok
    disease_cure_expression: false        # 완치·치료·낫는다 표현이 있는가
    ad_violation_hit: false               # 부당광고 적발 이력에 해당하는가 (현재 데이터 없음)
    prohibited_ad_expression: false       # 법으로 금지된 광고 표현을 쓰는가
    recognition: UNKNOWN                  # INDIVIDUAL | NOTIFIED | NOT_RECOGNIZED | UNKNOWN
    functionality_match: NOT_APPLICABLE   # EXACT | PARTIAL | MISMATCH | NOT_APPLICABLE
    supporting_papers: 0
    refuting_papers: 0
