# 원문에서 판정까지 전 구간을 재는 케이스들.
#
# gold_basic.yaml은 판정입력을 손으로 적어 규칙 엔진만 검증한다. 이 파일은
# 판정입력을 적지 않는다. 원문을 파이프라인에 넣어 ③ 구조화와 ④ 검증을
# 거친 결과를 기대 라벨과 비교하는 것이 목적이다.
#
# ⚠ 기대 라벨은 개발자 판단이며 의료 자문의 검수를 받지 않았다.
#   검수 후 값이 바뀌면 그것이 정답이다.
#
# 측정 방법
#   python scripts/measure_golden.py            # 실제 API 사용
#   python scripts/measure_golden.py --mode fake

- id: gold-101
  input: "홍삼은 면역력 증진에 도움을 줄 수 있지만 질병을 치료하지는 않습니다"
  expected: TRUSTWORTHY
  reason: 국가가 인정한 기능성 문구와 일치하고, 치료를 부정하는 책임 있는 문장이다.

- id: gold-102
  input: "루테인이 눈 건강에 도움을 줄 수 있습니다"
  expected: TRUSTWORTHY
  reason: 고시형 기능성 원료이고 주장 효능이 인정 문구와 같다.

- id: gold-103
  input: "루테인을 먹으면 치매도 예방된다고 합니다"
  expected: UNKNOWN
  reason: >-
    루테인은 눈 건강으로 인정된 원료지만 치매 예방은 인정된 기능성이 아니다.
    제목에 치매를 다룬 관련 연구도 찾지 못했다. 근거가 부족하면 판정을 미룬다.
  # v0.10에서 CAUTION을 UNKNOWN으로 고쳤다(2026-09-15 사용자 결정). 이전에 조심하세요가
  # 나온 것은 루테인 항산화 화학 논문이 초록 단어로 치매 연구로 잘못 세어졌기 때문이다.
  # 기대값을 WARNING에서 CAUTION으로 고쳤다. 처음 적은 WARNING이
  # gold-004(마늘·혈압)와 어긋났기 때문이다. 두 케이스는 구조가 같다.
  # 성분은 다른 효능으로 인정받았고 주장 효능은 미인정이다. 한쪽만 WARNING을
  # 주는 것은 일관성이 없다.
  #
  # 다만 남는 질문이 있다. 이 문장은 '치매'라는 질병의 예방을 말한다.
  # 질병 예방 주장을 신체기능 주장보다 엄하게 볼지는 자문의 판단이 필요하다.
  # 엄하게 보기로 하면 질병_예방_표현 규칙을 새로 만들어야 한다.

- id: gold-104
  input: "프로바이오틱스가 장 건강에 도움을 줄 수 있습니다"
  expected: TRUSTWORTHY
  reason: 고시형 인정 문구와 일치한다.

- id: gold-105
  input: "유산균이 아토피를 완치시킨다는 이야기가 있습니다"
  expected: WARNING
  reason: 질병 완치 표현이다. 인정 원료라도 예외가 아니다.

- id: gold-106
  input: "밀크씨슬이 간 건강에 도움을 줄 수 있습니다"
  expected: TRUSTWORTHY
  reason: 개별인정형 원료이고 인정 기능성이 간 건강이다.

- id: gold-107
  input: "오메가3가 혈액순환 개선에 도움을 줄 수 있습니다"
  expected: TRUSTWORTHY
  reason: 고시형 인정 문구와 일치한다.

- id: gold-108
  input: "블루베리가 당뇨를 완치시킨다는 말은 근거가 없습니다"
  expected: UNKNOWN
  reason: 오정보를 바로잡는 문장이다. 주장이 아니므로 판정을 보류한다.

- id: gold-109
  input: "강황이 관절 건강에 도움을 줄 수 있습니다"
  expected: CAUTION
  reason: >-
    커큐민이 관절 건강으로 개별인정을 받았지만 논문이 뒷받침 2편·반박 2편으로 갈린다.
    믿을 만해요는 뒷받침이 반박의 두 배 이상일 때만 준다(R-041 조심하세요).
  # v0.10에서 TRUSTWORTHY를 CAUTION으로 고쳤다(2026-09-16 사용자 결정). 이전에 믿을 만해요가
  # 나온 것은 "Health Benefits of Curcumin"처럼 관절과 무관한 논문을 뒷받침으로 세었기 때문이다.

- id: gold-110
  input: "마늘을 먹으면 고혈압이 낫는다고 합니다"
  expected: WARNING
  reason: 질병이 낫는다는 표현이다. 부당광고 적발 이력에도 해당한다.

- id: gold-111
  input: "이걸 꾸준히 드시면 당뇨가 낫습니다"
  expected: WARNING
  reason: 성분을 특정하지 못해도 질병 치료 표현은 주의로 간다.

- id: gold-112
  input: "수술 대신 이 즙을 드세요"
  expected: UNKNOWN
  reason: 시술을 대체하라는 내용이므로 서비스 범위 밖이다.

- id: gold-113
  input: "어제 홍삼을 한 박스 샀습니다"
  expected: UNKNOWN
  reason: 효능 주장이 없다. 판정할 대상이 없다.

- id: gold-114
  input: "홍삼이 혈압에 좋다고 들었어요"
  expected: UNKNOWN
  reason: >-
    홍삼의 인정 기능성에 혈압은 없다. 관련 연구는 뒷받침 1편·반박 2편으로 엇갈려
    조심하세요(반박 0편 또는 뒷받침 2편 이상)와 주의하세요(반박 우세) 어느 쪽에도 닿지 않는다.
    근거가 부족하면 판정을 미룬다.
  # v0.10에서 CAUTION을 UNKNOWN으로 고쳤다(2026-09-15 사용자 결정).
  # 논문 검색 결과가 바뀌면 판정도 바뀌는 케이스다.

- id: gold-115
  input: "홍삼은 부작용이 전혀 없어서 누구에게나 효과가 있습니다"
  expected: WARNING
  reason: >-
    부작용이 없다거나 누구에게나 효과가 있다는 표현은 식품 표시·광고법이
    금지하는 거짓·과장 광고다. 성분이 인정 원료라도 예외가 아니다.

- id: gold-116
  input: "이 홍삼은 식약처 공식 인증을 받은 제품입니다"
  expected: WARNING
  reason: >-
    식약처 인정은 원료의 기능성에 대한 것이고 제품 품질 보증이 아니다.
    공적 인증을 거짓으로 내세우는 표현이다.

- id: gold-117
  input: "마늘은 천연 항생제라고 불릴 만큼 좋습니다"
  expected: WARNING
  reason: 의약품으로 오인하게 하는 표현이다.
