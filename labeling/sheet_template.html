<title>건강지킴이 주장 분류</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f6f5fa; --surface:#ffffff; --surface-2:#efedf6; --ink:#1c1a28; --ink-2:#5d596f; --ink-3:#8b879c;
  --line:#dfdcea; --accent:#5b3cc4; --accent-ink:#ffffff; --accent-soft:#ebe6fb;
  --trust:#18864a; --trust-soft:#e2f4ea; --caution:#b98100; --caution-soft:#fbf1d6;
  --warning:#cf3b33; --warning-soft:#fbe4e2; --unknown:#77738a; --unknown-soft:#ebeaf0;
  --focus:#5b3cc4;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14121b; --surface:#1c1a26; --surface-2:#252232; --ink:#ecebf4; --ink-2:#a9a5ba; --ink-3:#7d7990;
    --line:#332f45; --accent:#a08bff; --accent-ink:#14121b; --accent-soft:#2a2542;
    --trust:#46c983; --trust-soft:#18301f; --caution:#ecbd3a; --caution-soft:#33290f;
    --warning:#ff7066; --warning-soft:#3a1c1a; --unknown:#aaa6b8; --unknown-soft:#2a2833; --focus:#a08bff;
  }
}
:root[data-theme="dark"]{
  --bg:#14121b; --surface:#1c1a26; --surface-2:#252232; --ink:#ecebf4; --ink-2:#a9a5ba; --ink-3:#7d7990;
  --line:#332f45; --accent:#a08bff; --accent-ink:#14121b; --accent-soft:#2a2542;
  --trust:#46c983; --trust-soft:#18301f; --caution:#ecbd3a; --caution-soft:#33290f;
  --warning:#ff7066; --warning-soft:#3a1c1a; --unknown:#aaa6b8; --unknown-soft:#2a2833; --focus:#a08bff;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--accent)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* 상단 바 */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;padding-block:10px;padding-inline:16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{display:flex;flex-direction:column;line-height:1.25;margin-right:auto}
.brand b{font-size:16px}
.brand span{font-size:12px;color:var(--ink-3)}
.tabs{display:flex;gap:4px;background:var(--surface-2);border-radius:10px;padding:3px}
.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:8px;font-weight:600;color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.me{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;font-weight:600}
.me .avatar{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:12px}
.mode{font-size:12px;color:var(--ink-3)}
.mode.shared::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--trust);margin-right:6px;vertical-align:1px}
.mode.local::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--caution);margin-right:6px;vertical-align:1px}

.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px;padding-inline:16px}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:minmax(0,1fr)}}

/* 사례 목록 */
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:10px}
.progress{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.progress .row{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2)}
.bar{height:6px;background:var(--surface-2);border-radius:99px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.case-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 220px);overflow:auto}
.case-list button{width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:8px 10px;display:grid;grid-template-columns:10px minmax(0,1fr);gap:4px 10px;align-items:center}
.case-list button:hover{background:var(--surface-2)}
.case-list button[aria-current="true"]{background:var(--accent-soft)}
.case-list .dot{width:9px;height:9px;border-radius:50%;border:2px solid var(--ink-3)}
.case-list .dot.part{border-color:var(--caution);background:linear-gradient(90deg,var(--caution) 50%,transparent 50%)}
.case-list .dot.done{border-color:var(--trust);background:var(--trust)}
.case-list .cid{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.case-list .ctext{grid-column:2;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.case-select{display:none}
@media (max-width:820px){
  .rail{position:static}
  .case-list{display:none}
  .case-select{display:block;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
}

/* 사례 본문 */
.case{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.case-head{padding:20px 22px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--ink-3);text-transform:uppercase}
.source{margin:0;font-size:18px;line-height:1.55;font-weight:500;text-wrap:pretty;border-left:3px solid var(--line);padding-left:14px}
.source a{word-break:break-all}
.q{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.q > span{font-size:14px;color:var(--ink-2);font-weight:500}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 14px;font-weight:600;font-size:14px}
.seg button:hover{border-color:var(--ink-3)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.note{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px;font-size:14px;resize:vertical}

.claim-tabs{display:flex;flex-wrap:wrap;gap:6px;padding:12px 22px 0}
.claim-tabs button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px 8px 0 0;border-bottom:0;padding:8px 14px;font-size:14px;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.claim-tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:inset 0 2px 0 var(--accent)}
.check{font-size:12px;color:var(--trust);font-weight:700}

.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface-2)}
.steps button{border:0;background:transparent;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;border-right:1px solid var(--line);color:var(--ink-2)}
.steps button:last-child{border-right:0}
.steps button b{font-size:14px}
.steps button small{font-size:11px;color:var(--ink-3)}
.steps button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 -3px 0 var(--accent)}
.steps button.done small{color:var(--trust);font-weight:600}
@media (max-width:520px){.steps button{padding:10px 4px}.steps button b{font-size:13px}}

.panel{padding:22px;display:flex;flex-direction:column;gap:18px;min-height:320px}
.panel h3{margin:0;font-size:13px;color:var(--ink-3);font-weight:600;letter-spacing:.02em}
.ask{background:var(--surface-2);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.ask > p{margin:0;font-weight:600}
.hint{margin:0;font-size:13px;color:var(--ink-2)}
.quote{font-size:17px;font-weight:600;margin:0;line-height:1.5}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 16px;margin:0;font-size:14px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;background:var(--surface-2);color:var(--ink-2)}
.badge.ok{background:var(--trust-soft);color:var(--trust)}
.badge.no{background:var(--unknown-soft);color:var(--unknown)}
.badge.fail{background:var(--warning-soft);color:var(--warning)}
.official{border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15px}
.official small{display:block;color:var(--ink-3);font-size:12px;margin-bottom:2px}
.extra{display:flex;flex-direction:column;gap:8px}

.papers{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.paper{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.paper.s-SUPPORT{border-color:color-mix(in srgb,var(--trust) 55%,var(--line))}
.paper.s-REFUTE{border-color:color-mix(in srgb,var(--warning) 55%,var(--line))}
.paper .title{font-weight:600;line-height:1.45;text-wrap:pretty}
.paper .meta{font-size:12px;color:var(--ink-3)}
.excerpt{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.65}
.excerpt small{display:block;font-size:12px;color:var(--ink-3);margin-bottom:4px}
.excerpt p{margin:0}
.excerpt p + p{margin-top:8px}
.excerpt p.en{margin-top:2px;font-size:12.5px;color:var(--ink-3)}
mark{background:var(--caution-soft);color:inherit;border-radius:3px;padding:0 2px;font-weight:600}
.paper details summary{font-size:13px;color:var(--ink-2);cursor:pointer}
.paper details p{margin:6px 0 0;font-size:13px;color:var(--ink-2);line-height:1.6}
.stance{display:flex;flex-wrap:wrap;gap:6px}
.stance button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 12px;font-size:13px;font-weight:600}
.stance button[data-val="SUPPORT"][aria-pressed="true"]{background:var(--trust);border-color:var(--trust);color:var(--surface)}
.stance button[data-val="REFUTE"][aria-pressed="true"]{background:var(--warning);border-color:var(--warning);color:var(--surface)}
.stance button[data-val="IRRELEVANT"][aria-pressed="true"]{background:var(--unknown);border-color:var(--unknown);color:var(--surface)}
.tally{display:flex;flex-wrap:wrap;gap:8px;font-size:13px}

.labels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.labels{grid-template-columns:repeat(2,minmax(0,1fr))}}
.label-btn{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:15px}
.label-btn i{width:22px;height:22px;border-radius:50%;display:block}
.label-btn[data-c="trust"] i{background:var(--trust)}
.label-btn[data-c="caution"] i{background:var(--caution)}
.label-btn[data-c="warning"] i{background:var(--warning)}
.label-btn[data-c="unknown"] i{background:var(--unknown)}
.label-btn[data-c="trust"][aria-pressed="true"]{border-color:var(--trust);background:var(--trust-soft)}
.label-btn[data-c="caution"][aria-pressed="true"]{border-color:var(--caution);background:var(--caution-soft)}
.label-btn[data-c="warning"][aria-pressed="true"]{border-color:var(--warning);background:var(--warning-soft)}
.label-btn[data-c="unknown"][aria-pressed="true"]{border-color:var(--unknown);background:var(--unknown-soft)}
details.svc summary{font-size:13px;color:var(--ink-2);cursor:pointer}
details.svc p{margin:6px 0 0;font-size:13px}
.callout{border-radius:10px;padding:10px 14px;font-size:14px;background:var(--caution-soft);color:var(--ink)}

.pager{display:flex;justify-content:space-between;gap:10px;padding:14px 22px;border-top:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:default}

/* 집계 */
.agg-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 16px;display:flex;flex-direction:column}
.stat b{font-size:22px;font-family:var(--mono)}
.stat span{font-size:12px;color:var(--ink-3)}
.agg-actions{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px}
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--ink-3);font-weight:600;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
.dist{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface-2);min-width:120px;margin-bottom:6px}
.dist i{display:block;height:100%}
.dist .trust{background:var(--trust)}.dist .caution{background:var(--caution)}.dist .warning{background:var(--warning)}.dist .unknown{background:var(--unknown)}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--ink-2)}
.status{font-weight:700;font-size:13px;white-space:nowrap}
.status.agree{color:var(--trust)}.status.ask{color:var(--warning)}.status.wait{color:var(--ink-3)}
.locked{color:var(--ink-3);font-size:13px}
td details summary{font-size:13px;color:var(--ink-2);cursor:pointer}
td details ul{margin:6px 0 0;padding-left:18px;font-size:13px}

/* 팀원 선택 */
.overlay{position:fixed;inset:0;background:rgb(10 8 20 / .5);display:grid;place-items:center;padding:16px;z-index:20}
.dialog{background:var(--surface);border-radius:16px;max-width:460px;width:100%;padding:22px;display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto}
.dialog h2{margin:0;font-size:20px}
.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.slots button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--ink-3)}
.slots button b{font-size:14px;color:var(--ink)}
.slots button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.field input{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);font-weight:400}
.guide{margin:0;padding-left:18px;font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand"><b>건강지킴이 주장 분류</b><span id="mode" class="mode">불러오는 중</span></div>
    <div class="tabs" role="tablist">
      <button id="tab-label" role="tab" aria-selected="true" data-act="view" data-val="label">분류하기</button>
      <button id="tab-agg" role="tab" aria-selected="false" data-act="view" data-val="agg">집계</button>
    </div>
    <button id="me" class="me" data-act="change-me"><span class="avatar">?</span><span>팀원 선택</span></button>
  </div>
</header>
<main class="wrap" id="app"></main>
<div id="dialog-root"></div>
<div id="toast" class="toast" hidden role="status"></div>
<input id="import-file" type="file" accept="application/json,.json" class="sr" tabindex="-1">

<script id="cases-data" type="application/json">/*CASES*/</script>
<script>
(() => {
"use strict";
const CASES = JSON.parse(document.getElementById("cases-data").textContent).filter(c => c.claims && c.claims.length);
const SLOTS = ["m1", "m2", "m3", "m4", "m5"];
const LABELS = [
  { v: "TRUSTWORTHY", t: "믿을 만해요", c: "trust" },
  { v: "CAUTION", t: "조심하세요", c: "caution" },
  { v: "WARNING", t: "주의하세요", c: "warning" },
  { v: "UNKNOWN", t: "알 수 없어요", c: "unknown" },
];
const LABEL_OF = Object.fromEntries(LABELS.map(l => [l.v, l]));
const STEPS = [
  { k: "claim", t: "② 주장" },
  { k: "mfds", t: "③ 식약처" },
  { k: "papers", t: "④ 논문" },
  { k: "label", t: "⑤ 판정" },
];
const LS_KEY = "hc-claim-labeling-v1";

const state = {
  mode: "loading",          // loading | shared | local
  me: null,                 // "m1".."m5"
  members: {},              // slot -> {name}
  labels: {},               // "caseId__slot" -> doc
  view: "label",
  caseIdx: 0, claimIdx: 0, step: "claim",
  pickSlot: null,
};
let db = null, downloads = null, readOnly = false;
// 공유 저장소. 서버(LABELING_API)나 아티팩트 db 중 하나를 같은 모양으로 감싼다.
let remote = null;

// ── 로컬 저장 (본인 편의용 백업. 공유 모드에서도 함께 남긴다) ──
function loadLocal() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    if (s.me && SLOTS.includes(s.me)) state.me = s.me;
    if (s.members) state.members = s.members;
    if (s.labels) state.labels = s.labels;
    if (Number.isInteger(s.caseIdx) && s.caseIdx < CASES.length) state.caseIdx = s.caseIdx;
  } catch (e) { /* 저장소를 쓸 수 없는 환경 */ }
}
function saveLocal() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({ me: state.me, members: state.members, labels: state.labels, caseIdx: state.caseIdx }));
  } catch (e) { /* 무시 */ }
}

// ── 문서 구조 ──
const keyOf = (caseId, slot) => `${caseId}__${slot}`;
function emptyDoc(cs, slot) {
  return {
    caseId: cs.id, slot, name: state.members[slot]?.name || "",
    missingClaim: null, missingNote: "",
    claims: cs.claims.map(() => ({ extraction: null, extractionNote: "", match: null, skipPapers: false, stances: {}, label: null, reason: "" })),
    updatedAt: null,
  };
}
function myDoc(cs, create) {
  if (!state.me) return null;
  const k = keyOf(cs.id, state.me);
  if (!state.labels[k] && create) state.labels[k] = emptyDoc(cs, state.me);
  const d = state.labels[k];
  if (d) while (d.claims.length < cs.claims.length) d.claims.push({ extraction: null, extractionNote: "", match: null, skipPapers: false, stances: {}, label: null, reason: "" });
  return d || null;
}
const isRecognized = c => !!c.mfds && (c.mfds.recognition === "개별인정" || c.mfds.recognition === "고시형");
function stepDone(c, d, step) {
  if (!d) return false;
  if (step === "claim") return !!d.extraction;
  if (step === "mfds") return !isRecognized(c) || !!d.match;
  if (step === "papers") return d.skipPapers || c.papers.length === 0 || c.papers.every((_, i) => d.stances[i]);
  if (step === "label") return !!d.label;
  return false;
}
function claimDone(c, d) {
  if (!d || !d.extraction) return false;
  if (d.extraction === "WRONG") return true;
  return stepDone(c, d, "mfds") && !!d.label;
}
function caseDone(cs, doc) { return !!doc && !!doc.missingClaim && cs.claims.every((c, i) => claimDone(c, doc.claims[i])); }
function caseStarted(doc) { return !!doc && (!!doc.missingClaim || doc.claims.some(x => x.extraction || x.label || x.match)); }

// ── 공유 저장 ──
// 문서마다 입력이 멈추면 한 번만 쓰고, 쓰기는 한 번에 하나씩 이어 붙인다.
const timers = {}, chains = {}, inflight = {}, dirty = new Set();
function writeShared(k) {
  if (state.mode !== "shared" || readOnly || !remote || !state.labels[k]) return;
  dirty.add(k);
  clearTimeout(timers[k]);
  timers[k] = setTimeout(() => {
    timers[k] = null;
    const body = JSON.parse(JSON.stringify(state.labels[k]));
    inflight[k] = (inflight[k] || 0) + 1;
    chains[k] = (chains[k] || Promise.resolve())
      .then(() => remote.setLabel(k, body))
      .catch(err => {
        if (err && (err.code === "invalid_argument" || err.status === 401 || err.status === 403 || err.status === 404)) { readOnly = true; toast("이 화면에서는 팀 저장 권한이 없어요. 내 브라우저에만 남깁니다."); }
        else if (err && err.code === "quota_exceeded") toast("저장 공간이 가득 찼어요. 시트 관리자에게 알려 주세요.");
        else toast("저장하지 못했어요. 잠시 뒤 다시 선택해 주세요.");
      })
      .finally(() => { inflight[k]--; if (!timers[k] && !inflight[k]) dirty.delete(k); });
  }, 600);
}
function persist(cs) {
  const doc = myDoc(cs, true);
  doc.name = state.members[state.me]?.name || doc.name;
  doc.updatedAt = new Date().toISOString();
  saveLocal();
  writeShared(keyOf(cs.id, state.me));
}
async function saveMember(slot, name) {
  state.members[slot] = { name };
  saveLocal();
  if (state.mode === "shared" && !readOnly && remote) {
    try { await remote.setMember(slot, name); }
    catch (e) { toast("팀원 이름을 저장하지 못했어요."); }
  }
}

// 서버와 아티팩트 db가 돌려준 분류 문서를 반영한다. 첫 동기화 때 서버에 없는 내 분류는 올린다.
let firstSync = true;
function applyLabels(entries) {
  const seen = new Set();
  entries.forEach(([id, data]) => {
    seen.add(id);
    if (dirty.has(id)) return; // 내가 고치는 중인 문서는 로컬 값이 우선
    state.labels[id] = JSON.parse(JSON.stringify(data));
  });
  if (firstSync) {
    firstSync = false;
    Object.keys(state.labels).forEach(k => { if (state.me && k.endsWith("__" + state.me) && !seen.has(k)) writeShared(k); });
  }
  renderRail(); renderTop();
  if (state.view === "agg") renderMain();
}
function applyMembers(entries) {
  entries.forEach(([slot, data]) => { if (data && data.name) state.members[slot] = { name: data.name }; });
  saveLocal(); renderTop(); if (state.view === "agg") renderMain(); renderDialog();
}

async function connectServer(base) {
  const call = async (method, path, body) => {
    const res = await fetch(base + path, { method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined, cache: "no-store" });
    if (!res.ok) { const e = new Error("HTTP " + res.status); e.status = res.status; throw e; }
    return res.json();
  };
  remote = {
    setLabel: (k, body) => call("PUT", "/labels/" + encodeURIComponent(k), body),
    setMember: (slot, name) => call("PUT", "/members/" + slot, { name }),
  };
  state.mode = "shared";
  renderAll();
  const pull = async () => {
    try {
      const data = await call("GET", "/state");
      applyMembers(Object.entries(data.members || {}));
      applyLabels(Object.entries(data.labels || {}));
    } catch (e) { toast("팀 분류를 불러오지 못했어요. 잠시 뒤 다시 시도합니다."); }
  };
  await pull();
  // 다른 팀원의 분류는 20초마다, 화면이 보일 때만 새로 받는다.
  setInterval(() => { if (!document.hidden) pull(); }, 20000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) pull(); });
}

async function connect() {
  if (window.LABELING_API) { await connectServer(window.LABELING_API); return; }
  if (!window.claude || typeof window.claude.use !== "function") { state.mode = "local"; renderAll(); return; }
  claude.use("downloads").then(d => { downloads = d; if (state.view === "agg") renderMain(); });
  db = await claude.use("db");
  if (!db) { state.mode = "local"; renderAll(); return; }
  state.mode = "shared";
  remote = {
    setLabel: (k, body) => db.doc("labels/" + k).set(body),
    setMember: (slot, name) => db.doc("members/" + slot).set({ name }),
  };
  db.collection("members").onSnapshot(snap => {
    applyMembers(snap.docs.filter(d => d.exists).map(d => [d.id, d.data()]));
  }, () => {});
  db.collection("labels").onSnapshot(snap => {
    if (snap.metadata.fromCache && firstSync) return; // 서버 확정본을 받은 뒤 첫 동기화를 한다
    applyLabels(snap.docs.filter(d => d.exists).map(d => [d.id, d.data()]));
  }, () => { toast("다른 팀원의 분류를 불러오지 못했어요. 새로고침해 주세요."); });
  renderAll();
}

// ── 렌더 ──
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
// 초록 문장에서 주장의 성분·효능 단어(앞부분)를 강조한다. 원문은 조각마다 이스케이프한다.
function hl(text, terms) {
  const list = (terms || []).filter(Boolean).map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  if (!list.length) return esc(text);
  const re = new RegExp("\\b(" + list.join("|") + ")[\\w-]*", "gi");
  let out = "", last = 0;
  String(text).replace(re, (m, _g, offset) => { out += esc(text.slice(last, offset)) + "<mark>" + esc(m) + "</mark>"; last = offset + m.length; return m; });
  return out + esc(text.slice(last));
}
const pressed = b => `aria-pressed="${b ? "true" : "false"}"`;

function renderAll() { renderTop(); renderMain(); renderDialog(); }

function renderTop() {
  const m = $("mode");
  m.className = "mode " + state.mode;
  m.textContent = state.mode === "shared" ? "팀 공유 저장 중" : state.mode === "local" ? "내 브라우저에만 저장 · 집계에서 파일로 내보내기" : "불러오는 중";
  $("tab-label").setAttribute("aria-selected", String(state.view === "label"));
  $("tab-agg").setAttribute("aria-selected", String(state.view === "agg"));
  const me = $("me");
  const name = state.me ? (state.members[state.me]?.name || slotTitle(state.me)) : "팀원 선택";
  me.innerHTML = `<span class="avatar">${esc(state.me ? name.slice(0, 1) : "?")}</span><span>${esc(name)}</span>`;
}
const slotTitle = s => "팀원 " + s.slice(1);

function renderMain() {
  const app = $("app");
  if (!CASES.length) { app.innerHTML = `<p>분류할 사례가 없습니다.</p>`; return; }
  if (state.view === "agg") { app.innerHTML = aggView(); return; }
  app.innerHTML = `<div class="layout"><aside class="rail" id="rail"></aside><div id="case"></div></div>`;
  renderRail(); renderCase();
}

function renderRail() {
  const rail = $("rail");
  if (!rail) return;
  let done = 0;
  const items = CASES.map((cs, i) => {
    const d = state.me ? state.labels[keyOf(cs.id, state.me)] : null;
    const st = caseDone(cs, d) ? "done" : caseStarted(d) ? "part" : "";
    if (st === "done") done++;
    const first = cs.claims[0];
    return `<li><button data-act="goto-case" data-val="${i}" aria-current="${i === state.caseIdx}">
      <span class="dot ${st}" aria-hidden="true"></span><span class="cid">${esc(cs.id)} · 주장 ${cs.claims.length}</span>
      <span class="ctext">${esc(first.ingredient)} — ${esc(cs.input)}</span></button></li>`;
  }).join("");
  const opts = CASES.map((cs, i) => `<option value="${i}" ${i === state.caseIdx ? "selected" : ""}>${esc(cs.id)} · ${esc(cs.input.slice(0, 30))}</option>`).join("");
  rail.innerHTML = `
    <div class="progress"><div class="row"><span>내 분류</span><span class="mono">${done} / ${CASES.length}</span></div>
      <div class="bar"><i style="width:${(done / CASES.length) * 100}%"></i></div></div>
    <label class="sr" for="case-select">사례 선택</label>
    <select id="case-select" class="case-select">${opts}</select>
    <ul class="case-list">${items}</ul>`;
}

function renderCase() {
  const host = $("case");
  if (!host) return;
  const cs = CASES[state.caseIdx];
  const c = cs.claims[state.claimIdx] || cs.claims[0];
  const doc = myDoc(cs, false);
  const d = doc ? doc.claims[state.claimIdx] : null;
  const isUrl = /^https?:\/\//i.test(cs.input.trim());
  const source = isUrl ? `<a href="${esc(cs.input.trim())}" target="_blank" rel="noopener">${esc(cs.input)}</a>` : esc(cs.input);

  const claimTabs = cs.claims.map((x, i) => `<button role="tab" aria-selected="${i === state.claimIdx}" data-act="goto-claim" data-val="${i}">
      주장 ${i + 1} · ${esc(x.ingredient)}${doc && claimDone(x, doc.claims[i]) ? ' <span class="check">✓ 완료</span>' : ""}</button>`).join("");

  const steps = STEPS.map(s => {
    const optional = s.k === "papers";
    const ok = stepDone(c, d, s.k);
    const sub = ok ? "완료" : optional ? "선택" : "필요";
    return `<button role="tab" class="${ok ? "done" : ""}" aria-selected="${state.step === s.k}" data-act="goto-step" data-val="${s.k}"><b>${s.t}</b><small>${sub}</small></button>`;
  }).join("");

  const idx = STEPS.findIndex(s => s.k === state.step);
  const lastClaim = state.claimIdx === cs.claims.length - 1;
  const nextLabel = idx < STEPS.length - 1 ? "다음 단계" : !lastClaim ? "다음 주장" : state.caseIdx < CASES.length - 1 ? "다음 사례" : "마지막 사례예요";
  const nextDisabled = idx === STEPS.length - 1 && lastClaim && state.caseIdx === CASES.length - 1;

  host.innerHTML = `<article class="case">
    <header class="case-head">
      <div class="eyebrow">① 원문 · ${esc(cs.id)} · ${state.caseIdx + 1} / ${CASES.length}</div>
      ${cs.source === "실제 링크" ? `<div class="hint">실제로 공유되는 글·영상입니다. 링크를 열어 전체를 볼 수 있고, 주장마다 앞뒤 문맥을 함께 보여 드려요.</div>` : ""}
      ${cs.source === "조회 실패 가정" ? `<div class="callout">식약처 조회가 실패했다고 가정한 사례입니다. 국가 인정 여부를 모르는 상태에서 어떻게 알릴지 판단해 주세요.</div>` : ""}
      <p class="source">${source}</p>
      <div class="q"><span>서비스가 놓친 주장이 있나요?</span>
        <div class="seg">
          <button data-act="set-missing" data-val="NO" ${pressed(doc?.missingClaim === "NO")}>없음</button>
          <button data-act="set-missing" data-val="YES" ${pressed(doc?.missingClaim === "YES")}>있음</button>
        </div></div>
      ${doc?.missingClaim === "YES" ? `<label class="sr" for="missingNote">놓친 주장</label><input id="missingNote" class="note" data-field="missingNote" placeholder="놓친 주장을 적어 주세요 (예: 마늘 — 면역력)" value="${esc(doc.missingNote)}">` : ""}
    </header>
    <nav class="claim-tabs" role="tablist" aria-label="주장">${claimTabs}</nav>
    <nav class="steps" role="tablist" aria-label="단계">${steps}</nav>
    <section class="panel">${panel(cs, c, d)}</section>
    <footer class="pager">
      <button class="btn" data-act="prev" ${state.caseIdx === 0 && state.claimIdx === 0 && idx === 0 ? "disabled" : ""}>이전</button>
      <button class="btn primary" data-act="next" ${nextDisabled ? "disabled" : ""}>${nextLabel}</button>
    </footer>
  </article>`;
}

function panel(cs, c, d) {
  const wrong = d?.extraction === "WRONG";
  const wrongNote = wrong && state.step !== "claim" ? `<div class="callout">② 주장 확인에서 '틀림'을 고르셨어요. 이 주장은 판정표 수정에 쓰지 않으므로 나머지 단계는 건너뛰어도 됩니다.</div>` : "";
  if (state.step === "claim") {
    return `<h3>서비스가 원문에서 뽑은 주장</h3>
      <p class="quote">“${esc(c.statement || `${c.ingredient} ${c.effect}`)}”</p>
      ${c.context ? `<div class="official"><small>원문에서 이 주장의 앞뒤</small>${esc(c.context)}</div>` : ""}
      <dl class="kv"><dt>성분</dt><dd>${esc(c.ingredient)}</dd><dt>효능</dt><dd>${esc(c.effect)}</dd>
        <dt>표현 강도</dt><dd>${esc({ SUGGESTIVE: "완화 (도움이 된다, 좋다 등)", ASSERTIVE: "단정 (낫는다, 없어진다 등)", UNCERTAIN: "추측 (~한다고 한다 등)" }[c.intensity] || c.intensity)}</dd></dl>
      <div class="ask"><p>원문에서 주장을 제대로 뽑았나요?</p>
        <p class="hint">성분과 효능이 원문이 말하는 내용과 같은지 봅니다. 사실인지는 아직 판단하지 않습니다.</p>
        <div class="seg">
          <button data-act="set-extraction" data-val="OK" ${pressed(d?.extraction === "OK")}>맞음</button>
          <button data-act="set-extraction" data-val="WRONG" ${pressed(d?.extraction === "WRONG")}>틀림</button>
        </div>
        ${wrong ? `<label class="sr" for="extractionNote">틀린 이유</label><input id="extractionNote" class="note" data-field="extractionNote" placeholder="무엇이 틀렸나요? (예: 효능은 '혈압'이 아니라 '혈관')" value="${esc(d.extractionNote)}">` : ""}

  }

    const cls = m.failed || m.recognition === "조회 실패" ? "fail" : isRecognized(c) ? "ok" : "no";
    const extras = (c.extra || []).map(x => `<div class="official"><small>${esc(x.source)}</small>${esc(x.title)}${(x.lines || []).map(l => `<div class="hint">${esc(l)}</div>`).join("")}</div>`).join("");
    return wrongNote + `<h3>식약처 건강기능식품 기능성 원료 조회 결과</h3>
      <div><span class="badge ${cls}">${esc(m.recognition)}</span></div>
      <dl class="kv"><dt>조회한 성분</dt><dd>${esc(c.ingredient)}</dd><dt>주장 효능</dt><dd>${esc(c.effect)}</dd>
        ${m.no ? `<dt>인정번호</dt><dd class="mono">${esc(m.no)}</dd>` : ""}</dl>
      ${m.text ? `<div class="official"><small>국가가 인정한 기능성 문구</small>${esc(m.text)}</div>` : ""}
      ${m.others && m.others.length ? `<div class="official"><small>이 성분이 다른 효능으로 인정받은 내용 (주장 효능과는 다름)</small>${m.others.map(o => `<div>${esc(o)}</div>`).join("")}</div>` : ""}
      ${extras ? `<div class="extra">${extras}</div>` : ""}
      ${isRecognized(c) ? `<div class="ask"><p>주장 효능과 국가 인정 문구가 같은 뜻인가요?</p>
          <p class="hint">'일부만 일치'는 인정 범위보다 넓게 말하거나 일부만 겹치는 경우입니다.</p>
          <div class="seg">
            <button data-act="set-match" data-val="EXACT" ${pressed(d?.match === "EXACT")}>일치</button>

            <button data-act="set-match" data-val="MISMATCH" ${pressed(d?.match === "MISMATCH")}>다름</button>
          </div></div>`
        : `<p class="hint">${m.recognition === "조회 실패" ? "조회에 실패해 국가 인정 여부를 모르는 상태로 판정합니다." : "주장 효능으로 인정받은 기록이 없어 비교할 문구가 없어요. 다음 단계로 넘어가세요."}</p>`}`;
  }
  if (state.step === "papers") {

    const counts = { SUPPORT: 0, REFUTE: 0, IRRELEVANT: 0 };
    Object.values(d?.stances || {}).forEach(v => { if (counts[v] !== undefined) counts[v]++; });
    const list = c.papers.map((p, i) => {
      const v = d?.stances?.[i] || "";
      const year = (p.date || "").slice(0, 4);
      return `<li class="paper s-${v}">

        <p class="hint">발췌 문장과 필요하면 초록 전체를 보고 판단합니다. 한국어는 기계 번역이고 아래 작은 글씨가 원문입니다. 노란 표시는 원문에서 주장의 성분·효능 단어입니다. 주장과 다른 효능·다른 성분을 다루거나, 동물·세포 실험만으로 사람에 대한 판단이 어렵다고 보면 그 이유를 한 줄 이유에 적어 주세요. 논문 판단은 1~2명만 맡아도 됩니다.</p>
        <div class="seg"><button data-act="toggle-skip" ${pressed(!!d?.skipPapers)}>이 주장은 논문 판단을 건너뜁니다</button></div>
        <div class="tally mono"><span>뒷받침 ${counts.SUPPORT}</span><span>반박 ${counts.REFUTE}</span><span>무관 ${counts.IRRELEVANT}</span><span>남음 ${c.papers.length - counts.SUPPORT - counts.REFUTE - counts.IRRELEVANT}</span></div>
      </div>
      <ul class="papers">${list}</ul>`;
  }
  // label
  const judged = Object.keys(d?.stances || {}).length;
  const sv = c.svcCount;
  return wrongNote + `<h3>이 주장을 어르신에게 어떻게 알려야 할까요?</h3>
    <p class="hint">① 원문, ③ 식약처 결과, ④ 논문 목록만 보고 판단합니다. 따로 검색하지 않습니다.</p>
    <div class="labels" role="group" aria-label="판정">
      ${LABELS.map(l => `<button class="label-btn" data-c="${l.c}" data-act="set-label" data-val="${l.v}" ${pressed(d?.label === l.v)}><i aria-hidden="true"></i>${l.t}</button>`).join("")}
    </div>
    <label class="field" for="reason">한 줄 이유
      <textarea id="reason" class="note" rows="2" data-field="reason" placeholder="예: 국가 인정 문구와 같고 뒷받침 논문이 많아서">${esc(d?.reason || "")}</textarea></label>
    ${sv && !judged ? `<details class="svc"><summary>서비스가 센 논문 편수 보기</summary>
      <p class="mono">뒷받침 ${sv.s}편 · 반박 ${sv.r}편${sv.failed ? " · 검색 실패" : ""} (전체 ${c.papers.length}편 중)</p>
      <p class="hint">논문을 직접 판단하지 않은 경우에만 참고하세요. 서비스의 분류는 제목·초록 표현 기반이라 거칩니다.</p></details>` : ""}`;
}

// ── 집계 ──
function aggView() {
  const named = SLOTS.filter(s => state.members[s]?.name);
  const total = Math.max(named.length, 1);
  const need = Math.ceil(total * 0.8);
  let agree = 0, ask = 0, myDone = 0;
  const rows = [];
  CASES.forEach(cs => {
    const mine = state.me ? state.labels[keyOf(cs.id, state.me)] : null;
    const unlocked = caseDone(cs, mine);
    if (unlocked) myDone++;
    const docs = SLOTS.map(s => state.labels[keyOf(cs.id, s)]).filter(Boolean);
    cs.claims.forEach((c, i) => {
      const entries = docs.map(doc => ({ doc, d: doc.claims?.[i] })).filter(x => x.d && (x.d.label || x.d.extraction === "WRONG"));
      const counts = Object.fromEntries(LABELS.map(l => [l.v, 0]));
      let wrong = 0;
      entries.forEach(x => { if (x.d.extraction === "WRONG") wrong++; else if (x.d.label) counts[x.d.label]++; });
      const n = entries.length - wrong;
      const top = LABELS.map(l => [l.v, counts[l.v]]).sort((a, b) => b[1] - a[1])[0];
      let status = "wait", statusText = `응답 모으는 중 (${entries.length}/${total})`;
      if (n > 0 && top[1] >= need) { status = "agree"; statusText = `확정 후보 · ${total}명 중 ${top[1]}명`; }
      else if (entries.length >= total) { status = "ask"; statusText = "교수님께 질문"; }
      if (unlocked) { if (status === "agree") agree++; if (status === "ask") ask++; }
      const dist = n ? LABELS.map(l => counts[l.v] ? `<i class="${l.c}" style="width:${counts[l.v] / n * 100}%"></i>` : "").join("") : "";
      const reasons = entries.map(x => `<li><b>${esc(x.doc.name || slotTitle(x.doc.slot))}</b> — ${x.d.extraction === "WRONG" ? `주장 추출 틀림${x.d.extractionNote ? ": " + esc(x.d.extractionNote) : ""}` : `${esc(LABEL_OF[x.d.label]?.t || "")}${x.d.match ? ` · 문구 ${esc({ EXACT: "일치", PARTIAL: "일부 일치", MISMATCH: "다름" }[x.d.match])}` : ""}${x.d.reason ? ": " + esc(x.d.reason) : ""}`}</li>`).join("");
      rows.push(`<tr>
        <td><div class="mono" style="font-size:12px;color:var(--ink-3)">${esc(cs.id)} · 주장 ${i + 1}</div><div>${esc(c.statement || c.ingredient + " " + c.effect)}</div>
          <div class="hint">${esc(c.mfds ? c.mfds.recognition : "식약처 조회 없음")} · 논문 ${c.papers.length}편</div></td>
        ${unlocked ? `<td><div class="dist">${dist}</div><div class="legend">${LABELS.filter(l => counts[l.v]).map(l => `<span>${l.t} ${counts[l.v]}</span>`).join("")}${wrong ? `<span>추출 틀림 ${wrong}</span>` : ""}</div></td>
          <td><span class="status ${status}">${statusText}</span></td>
          <td>${reasons ? `<details><summary>이유 ${entries.length}개</summary><ul>${reasons}</ul></details>` : ""}</td>`
        : `<td colspan="3" class="locked">내 분류를 마치면 다른 팀원의 결과가 보여요.</td>`}
      </tr>`);
    });
  });
  const canSave = !!downloads || !window.claude || !!window.LABELING_API;
  return `<div class="agg-head">
      <div class="stat"><b>${myDone}/${CASES.length}</b><span>내가 마친 사례</span></div>
      <div class="stat"><b>${agree}</b><span>확정 후보</span></div>
      <div class="stat"><b>${ask}</b><span>교수님께 질문</span></div>
      <div class="agg-actions">
        ${canSave ? `<button class="btn" data-act="export">결과 파일로 받기</button>` : ""}
        ${state.mode === "local" ? `<button class="btn" data-act="import">팀원 결과 파일 합치기</button>` : ""}
      </div>
    </div>
    <p class="hint" style="margin:0 0 12px">확정 후보는 이름을 등록한 팀원 ${total}명 중 ${need}명 이상이 같은 라벨을 고른 주장입니다. 모두 답했는데 그보다 갈리면 교수님께 질문할 목록에 올립니다.</p>
    <div class="table-wrap"><table>
      <thead><tr><th style="width:38%">주장</th><th>판정 분포</th><th>상태</th><th>이유</th></tr></thead>
      <tbody>${rows.join("")}</tbody></table></div>`;
}

// ── 팀원 선택 ──
function renderDialog() {
  const root = $("dialog-root");
  if (state.me && !state.choosing) { root.innerHTML = ""; return; }
  const pick = state.pickSlot || state.me;
  const cur = pick ? (state.members[pick]?.name || "") : "";
  const keepName = $("member-name")?.value;
  root.innerHTML = `<div class="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
    <h2 id="dlg-title">누구인지 골라 주세요</h2>
    <p class="hint">팀원마다 번호 하나를 씁니다. 다른 사람의 번호를 고르면 그 사람의 분류를 덮어씁니다.</p>
    <div class="slots">${SLOTS.map(s => `<button data-act="pick-slot" data-val="${s}" ${pressed(pick === s)}><b>${s.slice(1)}</b>${esc(state.members[s]?.name || "비어 있음")}</button>`).join("")}</div>
    <label class="field" for="member-name">이름<input id="member-name" autocomplete="off" placeholder="예: 홍길동" value="${esc(keepName ?? cur)}"></label>
    <ul class="guide">
      <li>① 원문 → ② 주장 → ③ 식약처 → ④ 논문 → ⑤ 판정 순서로 봅니다.</li>
      <li>주어진 근거만으로 판단하고 따로 검색하지 않습니다.</li>
      <li>다른 팀원의 결과는 내 분류를 마친 사례만 집계에서 보입니다.</li>
    </ul>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      ${state.me ? `<button class="btn" data-act="close-dialog">닫기</button>` : ""}
      <button class="btn primary" data-act="confirm-me" ${pick ? "" : "disabled"}>시작하기</button>
    </div></div></div>`;
}

// ── 이벤트 ──
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, 3200);
}
function goStep(delta) {
  const cs = CASES[state.caseIdx];
  let idx = STEPS.findIndex(s => s.k === state.step) + delta;
  if (idx >= STEPS.length) {
    idx = 0;
    if (state.claimIdx < cs.claims.length - 1) state.claimIdx++;
    else if (state.caseIdx < CASES.length - 1) { state.caseIdx++; state.claimIdx = 0; }
    else return;
  } else if (idx < 0) {
    idx = STEPS.length - 1;
    if (state.claimIdx > 0) state.claimIdx--;
    else if (state.caseIdx > 0) { state.caseIdx--; state.claimIdx = CASES[state.caseIdx].claims.length - 1; }
    else return;
  }
  state.step = STEPS[idx].k;
  saveLocal(); renderRail(); renderCase();
  $("case")?.scrollIntoView({ block: "start", behavior: "smooth" });
}
function requireMe() { if (!state.me) { state.choosing = true; renderDialog(); return false; } return true; }

document.addEventListener("click", async ev => {
  const b = ev.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act, val = b.dataset.val;
  const cs = CASES[state.caseIdx];
  switch (act) {
    case "view": state.view = val; renderTop(); renderMain(); return;
    case "change-me": state.choosing = true; state.pickSlot = state.me; renderDialog(); return;
    case "pick-slot": state.pickSlot = val; { const n = $("member-name"); if (n) n.value = state.members[val]?.name || ""; } renderDialog(); return;
    case "close-dialog": state.choosing = false; renderDialog(); return;
    case "confirm-me": {
      const slot = state.pickSlot || state.me; if (!slot) return;
      const name = ($("member-name")?.value || "").trim() || slotTitle(slot);
      state.me = slot; state.choosing = false; state.pickSlot = null;
      if (state.members[slot]?.name !== name) await saveMember(slot, name);
      saveLocal(); renderAll(); return;
    }
    case "goto-case": state.caseIdx = +val; state.claimIdx = 0; state.step = "claim"; saveLocal(); renderRail(); renderCase(); return;
    case "goto-claim": state.claimIdx = +val; state.step = "claim"; renderCase(); return;
    case "goto-step": state.step = val; renderCase(); return;
    case "next": goStep(1); return;
    case "prev": goStep(-1); return;
    case "export": return exportFile();
    case "import": $("import-file").click(); return;
  }
  if (!requireMe()) return;
  const doc = myDoc(cs, true);
  const d = doc.claims[state.claimIdx];
  const toggle = (obj, key, v) => { obj[key] = obj[key] === v ? null : v; };
  if (act === "set-missing") toggle(doc, "missingClaim", val);
  else if (act === "set-extraction") toggle(d, "extraction", val);
  else if (act === "set-match") toggle(d, "match", val);
  else if (act === "set-label") toggle(d, "label", val);
  else if (act === "toggle-skip") d.skipPapers = !d.skipPapers;
  else if (act === "set-stance") { const i = b.dataset.idx; if (d.stances[i] === val) delete d.stances[i]; else d.stances[i] = val; }
  else return;
  persist(cs);
  renderRail(); renderCase();
});

document.addEventListener("input", ev => {
  const f = ev.target.dataset?.field;
  if (!f || !requireMe()) return;
  const cs = CASES[state.caseIdx];
  const doc = myDoc(cs, true);
  if (f === "missingNote") doc.missingNote = ev.target.value;
  else doc.claims[state.claimIdx][f] = ev.target.value;
  persist(cs);
});
document.addEventListener("change", ev => {
  if (ev.target.id === "case-select") { state.caseIdx = +ev.target.value; state.claimIdx = 0; state.step = "claim"; saveLocal(); renderRail(); renderCase(); }
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Enter" && ev.target.id === "member-name") $("dialog-root").querySelector('[data-act="confirm-me"]')?.click();
});

async function exportFile() {
  const docs = Object.values(state.labels).filter(d => state.mode === "shared" || d.slot === state.me);
  const body = JSON.stringify({ exportedAt: new Date().toISOString(), mode: state.mode, members: state.members, labels: docs }, null, 1);
  const filename = `claim-labels-${state.mode === "shared" ? "team" : (state.members[state.me]?.name || state.me || "me")}.json`;
  if (downloads) {
    try { await downloads.save({ filename, data: body }); }
    catch (e) { if (e?.code !== "declined") toast("파일로 받지 못했어요. 잠시 뒤 다시 눌러 주세요."); }
    return;
  }
  if (!window.claude || window.LABELING_API) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([body], { type: "application/json" }));
    a.download = filename; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
}
$("import-file").addEventListener("change", async ev => {
  const files = [...ev.target.files];
  let added = 0;
  for (const file of files) {
    try {
      const data = JSON.parse(await file.text());
      Object.assign(state.members, data.members || {});
      (data.labels || []).forEach(doc => {
        if (!doc || !doc.caseId || !SLOTS.includes(doc.slot) || doc.slot === state.me) return;
        state.labels[keyOf(doc.caseId, doc.slot)] = doc; added++;
      });
    } catch (e) { toast(`${file.name}을 읽지 못했어요. 이 시트에서 받은 파일인지 확인해 주세요.`); }
  }
  ev.target.value = "";
  saveLocal(); renderAll();
  if (added) toast(`분류 ${added}건을 합쳤어요.`);
});

loadLocal();
if (!state.me) state.choosing = true;
renderAll();
connect();
})();
</script>
