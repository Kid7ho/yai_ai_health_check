# 의료 자문 시트에 넣는 사례 20건(2026-10-01 선정).
# 팀원 분류 시트(cases.json) 90건 중 자문의 판단이 규칙표 수정으로 바로 이어지는 사례만 골랐다.
# 식약처 조회 실패를 가정한 사례(기술 가정)와 금지 광고 표현 사례(법률 검토 대상)는 뺐다.
# id는 cases.json의 사례 번호다. 입력(문장·링크)으로 녹화 재생 결과를 찾는다.
# 주제는 시트에서 사례를 묶는 이름, 질문은 교수님께 특히 여쭙는 점이다.
주제:
  A: 믿을 만해요 기준 — 국가 인정 원료인데 논문이 적거나 엇갈림
  B: 단정 표현과 인정 문구의 범위
  C: 인정 범위 밖 효능인데 연구가 있는 경우
  D: 반박 우세 기준
  E: 질병 예방 주장
  F: 질병 치료·약 대체 표현
사례:
  - {id: lab-001, 주제: A, 질문: "기준 사례입니다. 국가 인정 문구와 같고 뒷받침 논문이 4편, 반박이 0편이라 '믿을 만해요'로 판정했습니다. 이 기준이 적절한지 봐 주세요."}
  - {id: lab-009, 주제: A, 질문: "관련 논문이 1편뿐인데 '믿을 만해요'로 판정했습니다. 믿을 만해요에 필요한 최소 논문 수가 있어야 할까요?"}
  - {id: lab-006, 주제: A, 질문: "고시형 원료지만 연구 결과에 논란이 있는 성분입니다. 뒷받침 4편·반박 2편으로 '믿을 만해요'가 나왔습니다(뒷받침이 반박의 2배 이상이면 믿을 만해요)."}
  - {id: lab-008, 주제: A, 질문: "개별인정 원료인데 반박 논문이 더 많습니다(뒷받침 3·반박 5). 지금은 '조심하세요'입니다. 더 엄하게 봐야 할까요?"}
  - {id: lab-011, 주제: A, 질문: "고시형 원료지만 효과 논란이 큰 대표 사례입니다. 뒷받침 1·반박 1로 '조심하세요'입니다."}
  - {id: link-17, 주제: B, 질문: "인정 문구는 '혈압 조절'인데 영상은 '혈압을 낮춘다'고 말합니다. 지금은 '부풀려 말함(조심하세요)'으로 봅니다. '낮춘다'와 '조절'을 같은 뜻으로 봐도 될까요?"}
  - {id: lab-018, 주제: B, 질문: "'통증이 반드시 사라진다'를 단정 표현(조심하세요)으로 봅니다. 질병을 낫게 한다는 표현(주의하세요)으로 봐야 할까요?"}
  - {id: link-06, 주제: C, 질문: "홍삼과 그 성분인 진세노사이드(사포닌)를 서비스는 다른 성분으로 봅니다. 같은 성분으로 합쳐 판단해야 할까요?"}
  - {id: lab-022, 주제: C, 질문: "비타민D의 국가 인정 기능성에는 면역이 없지만 뒷받침 논문은 7편입니다. '조심하세요'가 적절한가요?"}
  - {id: lab-025, 주제: C, 질문: "마그네슘·수면은 인정 기능성이 아니고 연구가 엇갈립니다(뒷받침 4·반박 2). '조심하세요'가 적절한가요?"}
  - {id: lab-023, 주제: C, 질문: "루테인은 눈 건강으로 인정받았지만 기억력은 아닙니다. 뒷받침 논문이 7편입니다. 인정 범위 밖 효능을 어떻게 알려야 할까요?"}
  - {id: lab-031, 주제: C, 질문: "관련 논문 대부분이 관절 주사 연구입니다. 먹는 식품의 근거로 셀 수 있을까요?"}
  - {id: link-13, 주제: C, 질문: "글의 근거가 쥐 실험입니다. 동물·세포 실험 논문을 사람 효과의 뒷받침으로 어디까지 셀 수 있을까요?"}
  - {id: lab-028, 주제: D, 질문: "반박 우세로 '주의하세요'가 나온 유일한 사례입니다(뒷받침 1·반박 3). 반박 우세 기준(2편 이상이고 상대의 2배 초과)이 적절한가요?"}
  - {id: lab-026, 주제: D, 질문: "반박이 더 많지만(뒷받침 1·반박 2) 기준에 못 미쳐 '알 수 없어요'로 보류했습니다. 보류가 맞을까요?"}
  - {id: link-37, 주제: E, 질문: "치매 예방처럼 질병 예방을 말하는 주장을 지금은 일반 효능 주장과 똑같이 봅니다. 더 엄하게 봐야 할까요?"}
  - {id: link-39, 주제: E, 질문: "'암 발생률 67% 감소'처럼 수치를 들어 질병 예방을 말하고 '의사'가 등장합니다. 지금 판정이 적절한가요?"}
  - {id: link-27, 주제: F, 질문: "당뇨병 완치를 말하는 글이라 다른 근거와 무관하게 '주의하세요'입니다. 반드시 잡혀야 하는 기준 사례입니다."}
  - {id: link-33, 주제: F, 질문: "과장 광고를 비판하는 글인데 인용한 광고 문장 때문에 '주의하세요'가 됐습니다. 이런 오판을 어떻게 다루면 좋을까요?"}
  - {id: link-32, 주제: F, 질문: "'혈압약 끊고 싶다면'처럼 약을 끊으라는 글을 지금은 범위 밖으로 보고 판정하지 않습니다. '주의하세요'로 경고해야 할까요?"}
