# Fly.io 배포 설정. 키는 여기에 적지 않는다. `fly secrets`로 넣는다.
# 앱 이름은 Fly 전체에서 고유해야 한다. 만들 때 정한 이름으로 바꾼다.
app = "yai-health-check"
primary_region = "nrt"

[build]

[env]
  ADAPTER_MODE = "live"
  WORKER_COUNT = "2"
  DEBUG_UI = "0"
  LOG_SKILL_REQUEST = "0"
  LOG_LEVEL = "INFO"
  ARTICLE_ENABLED = "1"
  ASR_ENABLED = "0"
  # 링크(유튜브·기사) 본문 주장 추출: Liner Model API + 규칙 기반 합치기(2026-09-17 A안).
  # 직접 붙여 넣은 글은 규칙 기반만 쓴다(Liner 약관 5.8 민감정보 조항, 법률 검토 전).
  LINK_CLAIM_EXTRACTOR = "liner"
  LINER_REASONING_EFFORT = "low"
  # 논문 입장 분류: Liner Model API(none). 공개 논문과 성분·효능 영문 검색어만 보낸다(2026-09-17).
  PAPER_STANCE_CLASSIFIER = "liner"
  PAPER_STANCE_EFFORT = "none"
  # 반박 후보만 한 번 더 확인한다(몸속 칼슘 신호·다른 질병·배경 문장이 반박으로 세어지던 문제).
  PAPER_STANCE_VERIFY_EFFORT = "none"
  # 판정 기록과 식약처 사본은 볼륨에 둔다. 컨테이너 파일시스템은 배포할 때마다 초기화된다.
  DATABASE_PATH = "/data/healthcheck.db"
  MFDS_SNAPSHOT_PATH = "/data/mfds_i0040.json"
  # 팀원 분류 결과. LABELING_TOKEN은 fly secrets에 둔다.
  LABELING_DB_PATH = "/data/labeling.db"
  # 영상 받아 적기 캐시. 같은 영상을 다시 읽지 않아 Gemini 무료 한도를 아낀다.
  TRANSCRIPT_CACHE_PATH = "/data/transcripts.db"
  # 결과 카드 이미지를 카카오가 내려받을 주소. 앱 이름을 바꾸면 함께 바꾼다.
  PUBLIC_BASE_URL = "https://yai-health-check.fly.dev"
  # 공유받은 사람이 [채널 홈]·[나도 확인해 보기]를 누르면 가는 곳. /chat을 붙이면 채팅방이다.
  CHANNEL_URL = "https://pf.kakao.com/_FZXrX"

[[mounts]]
  source = "healthcheck_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # 콜백은 요청을 받은 뒤 같은 프로세스의 워커가 보낸다. 머신이 자동으로
  # 멈추면 접수한 작업이 사라지므로 항상 한 대를 켜 둔다.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
